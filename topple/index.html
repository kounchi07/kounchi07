<title>Topple</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: candy-puzzle look. Full-bleed 3D tower; HUD (level, goal bar with 3 stars, wallet) on top;
   hand + BANK + boosters docked bottom. Single bright look by design (no light/dark split). */
:root{
  --sky-top:#3d4be6; --sky-bot:#6b2fd3; --night:#24138a;
  --ink:#ffffff; --ink-dim:#d9dcff;
  --green-1:#8cf55f; --green-2:#26b83a; --green-sh:#157a27;
  --gold-1:#ffe45c; --gold-2:#ffad0f; --gold-sh:#b86a00;
  --pink-1:#ff7cc0; --pink-2:#e8287a; --pink-sh:#9c0f52;
  --blue-1:#7fc4ff; --blue-2:#3a72ff; --blue-sh:#1e3fae;
  --danger:#ff3b5c;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:linear-gradient(180deg,var(--sky-top),var(--sky-bot));color:var(--ink);font-family:var(--body);font-weight:800;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#gl.hot{cursor:pointer}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid var(--gold-1);outline-offset:3px}
svg{display:block}

/* chunky outlined game text */
.gt{font-family:var(--display);color:#fff;letter-spacing:.02em;
  text-shadow:0 3px 0 var(--night),2px 2px 0 var(--night),-2px 2px 0 var(--night),2px -2px 0 var(--night),-2px -2px 0 var(--night),0 6px 10px rgba(0,0,0,.35)}

/* buttons that press down */
.btn{font-family:var(--display);font-size:24px;color:#fff;border-radius:18px;padding:13px 26px;position:relative;
  box-shadow:0 6px 0 var(--sh),inset 0 3px 0 rgba(255,255,255,.5);text-shadow:0 2px 0 rgba(0,0,0,.25);transition:transform .06s,box-shadow .06s}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 var(--sh),inset 0 3px 0 rgba(255,255,255,.5)}
.btn.green{background:linear-gradient(180deg,var(--green-1),var(--green-2));--sh:var(--green-sh)}
.btn.blue{background:linear-gradient(180deg,var(--blue-1),var(--blue-2));--sh:var(--blue-sh)}
.btn.small{font-size:18px;padding:9px 18px;border-radius:14px}
.btn:disabled{background:linear-gradient(180deg,#a9acd6,#7d80b8);--sh:#53568c;color:#eef}

/* top HUD */
.top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px;pointer-events:none}
.lvl{flex:none;width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--pink-1),var(--pink-2));border:3px solid #fff;box-shadow:0 4px 0 var(--pink-sh);display:grid;place-items:center;line-height:1;text-align:center}
.lvl small{display:block;font-family:var(--body);font-size:9px;letter-spacing:.08em}
.lvl b{font-family:var(--display);font-size:22px;font-weight:400}
.goal{flex:1;min-width:0;max-width:460px;margin-inline:auto}
.goal .label{display:flex;justify-content:space-between;font-size:12px;margin:0 4px 6px;color:var(--ink-dim)}
.bar{position:relative;height:20px;border-radius:999px;background:rgba(20,8,90,.55);border:3px solid #fff;box-shadow:0 3px 0 rgba(20,8,90,.5)}
.bar .fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:999px;background:linear-gradient(180deg,#fff27a,#ffb20f);transition:width .35s cubic-bezier(.3,1.4,.5,1)}
.bar .fill::after{content:"";position:absolute;left:6px;right:6px;top:2px;height:4px;border-radius:9px;background:rgba(255,255,255,.65)}
.star{position:absolute;top:50%;width:30px;height:30px;transform:translate(-50%,-55%)}
.star use{fill:#5d58a8;stroke:#fff;stroke-width:1.6;stroke-linejoin:round}
.star.on use{fill:#ffd21f}
.star.on{animation:starpop .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes starpop{0%{transform:translate(-50%,-55%) scale(.4)}100%{transform:translate(-50%,-55%) scale(1)}}
.pill{flex:none;display:flex;align-items:center;gap:6px;background:rgba(20,8,90,.55);border:2px solid rgba(255,255,255,.55);border-radius:999px;padding:3px 12px 3px 3px;font-family:var(--display);font-size:19px;font-variant-numeric:tabular-nums}
.coin{width:24px;height:24px;flex:none}

/* bottom dock */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:min(500px,calc(100% - 24px));display:grid;gap:10px}
.stab{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim)}
.stab .track{flex:1;height:10px;border-radius:99px;background:rgba(20,8,90,.55);border:2px solid rgba(255,255,255,.5);overflow:hidden}
.stab .track i{display:block;height:100%;width:100%;border-radius:99px;background:var(--green-1);transition:background .2s}
.stab b{font-family:var(--display);font-weight:400;font-size:15px;letter-spacing:.04em;color:var(--danger);text-transform:none;opacity:0;transition:opacity .2s}
.stab b.on{opacity:1;animation:wig .3s infinite alternate}
@keyframes wig{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.handrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.08));border:3px solid rgba(255,255,255,.6);border-radius:22px;padding:10px 12px;box-shadow:0 6px 0 rgba(20,8,90,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hand{display:flex;align-items:center;gap:10px;min-width:0}
.hand .coin{width:40px;height:40px}
.hand .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim)}
.hand .n{font-size:32px;line-height:1}
.mult{font-family:var(--display);font-size:16px;background:linear-gradient(180deg,var(--gold-1),var(--gold-2));color:#5a2d00;border-radius:10px;padding:2px 8px;box-shadow:0 3px 0 var(--gold-sh)}
#bank{min-width:128px;font-size:26px;line-height:1.05}
#bank small{display:block;font-family:var(--body);font-size:12px;letter-spacing:.06em;opacity:.95}
#bank.ready{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.2)}}
.boosts{display:flex;justify-content:center;gap:18px}
.boost{width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--blue-1),var(--blue-2));border:3px solid #fff;box-shadow:0 4px 0 var(--blue-sh);display:grid;place-items:center;position:relative}
.boost:active{transform:translateY(3px);box-shadow:0 1px 0 var(--blue-sh)}
.boost svg{width:30px;height:30px}
.boost .badge{position:absolute;top:-6px;right:-8px;min-width:24px;height:24px;border-radius:12px;padding:0 6px;background:linear-gradient(180deg,#ff6b81,#e8203f);border:2px solid #fff;font-family:var(--display);font-size:14px;display:grid;place-items:center}
.boost .badge.price{background:linear-gradient(180deg,var(--gold-1),var(--gold-2));color:#5a2d00}
.boost.active{box-shadow:0 4px 0 var(--blue-sh),0 0 0 4px var(--gold-1),0 0 24px var(--gold-1)}
.boost-name{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;color:var(--ink-dim)}

/* tutorial tip + tap ring */
#tip{position:fixed;top:calc(env(safe-area-inset-top,0px) + 84px);left:50%;transform:translateX(-50%);width:min(380px,calc(100% - 32px));background:#fff;color:#2b1a8a;border-radius:18px;padding:12px 16px;text-align:center;font-size:16px;line-height:1.35;box-shadow:0 6px 0 rgba(20,8,90,.45);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,4px)}}
#ring{position:fixed;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;border:4px solid #fff;pointer-events:none;box-shadow:0 0 0 3px rgba(43,26,138,.6);animation:tap 1s ease-out infinite}
@keyframes tap{0%{transform:scale(1.4);opacity:0}40%{opacity:1}100%{transform:scale(.7);opacity:0}}

/* overlays */
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(24,10,90,.55);padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-y:auto}
.panel{width:min(380px,100%);margin:auto;background:linear-gradient(180deg,#6474ff,#4130c9);border:4px solid #fff;border-radius:28px;box-shadow:0 10px 0 var(--night),0 24px 50px rgba(0,0,0,.35);padding:44px 22px 24px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;position:relative;animation:panelin .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes panelin{from{transform:scale(.7);opacity:0}}
.ribbon{position:absolute;top:-26px;left:50%;transform:translateX(-50%);white-space:nowrap;background:linear-gradient(180deg,var(--pink-1),var(--pink-2));border:3px solid #fff;border-radius:16px;padding:8px 22px;box-shadow:0 6px 0 var(--pink-sh);font-size:26px}
.ribbon.bad{background:linear-gradient(180deg,#ff7a8e,#e8203f);box-shadow:0 6px 0 #9c0f2a}
.panel p{margin:0;color:var(--ink-dim);line-height:1.4;font-size:16px}
.bigstars{display:flex;gap:6px;align-items:flex-end}
.bigstars svg{width:64px;height:64px}
.bigstars svg:nth-child(2){width:80px;height:80px}
.bigstars use{fill:#3a2c9a;stroke:#fff;stroke-width:1.4;stroke-linejoin:round}
.bigstars svg.on use{fill:#ffd21f}
.bigstars svg.on{animation:bigpop .45s cubic-bezier(.3,1.8,.5,1) both}
@keyframes bigpop{from{transform:scale(0) rotate(-40deg)}}
.reward{display:flex;align-items:center;gap:8px;font-size:30px}
.reward .coin{width:34px;height:34px}
.logo{font-family:var(--display);font-size:clamp(64px,19vw,92px);line-height:.9;color:#ffd21f;
  text-shadow:0 5px 0 #e8287a,3px 3px 0 #e8287a,-3px 3px 0 #e8287a,3px -3px 0 #e8287a,-3px -3px 0 #e8287a,0 10px 0 var(--night),0 14px 24px rgba(0,0,0,.4);transform:rotate(-4deg)}
.logo-blocks{display:flex;gap:6px;justify-content:center}
.logo-blocks i{width:34px;height:16px;border-radius:5px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),inset 0 3px 0 rgba(255,255,255,.5)}
.col{display:flex;flex-direction:column;gap:12px;width:100%}

/* in-world feedback */
.pop{position:fixed;transform:translate(-50%,-50%);font-size:28px;pointer-events:none;animation:rise 1s ease-out forwards;white-space:nowrap}
@keyframes rise{0%{opacity:0;margin-top:10px;scale:.6}15%{opacity:1;scale:1.15}30%{scale:1}100%{opacity:0;margin-top:-80px}}
#combo{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-size:clamp(40px,11vw,64px);pointer-events:none;text-align:center;line-height:1;opacity:0;white-space:nowrap}
#combo.show{animation:combo 1.1s cubic-bezier(.3,1.6,.5,1) forwards}
#combo small{display:block;font-size:.5em;color:#ffd21f}
@keyframes combo{0%{transform:translate(-50%,-50%) scale(0) rotate(-12deg);opacity:1}25%{transform:translate(-50%,-50%) scale(1.1) rotate(3deg);opacity:1}40%{transform:translate(-50%,-50%) scale(1) rotate(0);opacity:1}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
.flycoin{position:fixed;width:26px;height:26px;margin:-13px 0 0 -13px;pointer-events:none;z-index:5}
#vig{position:fixed;inset:0;pointer-events:none;transition:box-shadow .3s}
#vig.danger{box-shadow:inset 0 0 110px 20px rgba(255,40,80,.55)}
#vig.frozen{box-shadow:inset 0 0 110px 26px rgba(120,220,255,.75)}
.confetti{position:fixed;top:-20px;width:10px;height:16px;border-radius:3px;pointer-events:none;z-index:4}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 84px);left:50%;transform:translateX(-50%);background:var(--night);border:2px solid #fff;padding:8px 16px;border-radius:14px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center;width:max-content;max-width:calc(100% - 32px)}
#toast.on{opacity:1}
#mute{pointer-events:auto;width:40px;height:40px;border-radius:50%;background:rgba(20,8,90,.55);border:2px solid rgba(255,255,255,.55);display:grid;place-items:center;flex:none}
#mute svg{width:22px;height:22px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

<canvas id="gl" tabindex="0" aria-label="Tower of candy blocks. Tap a block to pull it out; drag to turn the tower."></canvas>
<div id="vig"></div>

<div class="top" id="top" hidden>
  <div class="lvl"><div><small>LEVEL</small><b id="lvl">1</b></div></div>
  <div class="goal">
    <div class="label"><span>Goal</span><span id="goalTxt">0 / 25</span></div>
    <div class="bar" id="bar"><div class="fill" id="fill"></div></div>

</div>

<div id="tip" hidden></div>
<div id="ring" hidden></div>
<div id="toast" role="status"></div>
<div id="combo" class="gt"></div>

<div class="dock" id="dock" hidden>
  <div class="stab"><span>Stability</span><div class="track"><i id="stab"></i></div><b id="careful">Careful!</b></div>
  <div class="handrow">
    <div class="hand">
      <svg class="coin" id="handCoin"><use href="#i-coin"/></svg>
      <div><div class="k">In your hand</div><div class="n gt" id="pot">0</div></div>
      <span class="mult" id="mult" hidden>×1.5</span>
    </div>
    <button class="btn green" id="bank" type="button" disabled>BANK<small id="bankSub">Goal 25</small></button>
  </div>
  <div class="boosts" id="boosts"></div>
</div>

<div class="overlay" id="menu">
  <div class="panel" style="padding-top:28px">
    <div class="logo-blocks"><i style="background:#ff3b5c"></i><i style="background:#ffcc1f"></i><i style="background:#35d65b"></i><i style="background:#2b9dff"></i><i style="background:#a65bff"></i></div>
    <div class="logo">TOPPLE</div>
    <p>Pull candy blocks from the tower.<br>Bank your coins before it falls!</p>
    <div class="pill" style="font-size:22px"><svg class="coin"><use href="#i-coin"/></svg><span id="menuWallet">0</span></div>
    <div class="col">
      <button class="btn green" id="play" type="button" style="font-size:30px">PLAY · Level 1</button>
    </div>
  </div>
</div>

<div class="overlay" id="win" hidden>
  <div class="panel">
    <div class="ribbon gt" id="winTitle">Level 1 Complete!</div>
    <div class="bigstars" id="bigstars"></div>
    <div class="reward gt">+<span id="winCoins">0</span><svg class="coin"><use href="#i-coin"/></svg></div>
    <p id="winText"></p>
    <div class="col">
      <button class="btn green" id="next" type="button">NEXT LEVEL</button>
      <button class="btn blue small" id="replay" type="button">Replay for more stars</button>

  </div>
</div>

<div class="overlay" id="lose" hidden>
  <div class="panel">
    <div class="ribbon bad gt">Toppled!</div>
    <p id="loseText"></p>
    <div class="col">
      <button class="btn green" id="retry" type="button">TRY AGAIN</button>
      <button class="btn blue small" id="toMenu" type="button">Menu</button>
    </div>
  </div>
</div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "cannon-es":"https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import * as CANNON from 'cannon-es';

// ---------- constants & save ----------
const BW = 3, BH = 0.6, BD = 1, GAP = 0.02;
const $ = id => document.getElementById(id);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const SAVE_KEY = 'topple-v2';
const save = (() => {
  const def = { level: 1, wallet: 0, stars: {}, boosters: { freeze: 2, xray: 2, shield: 2 }, tut: 0, tutCrack: false, muted: false };
  try { return Object.assign(def, JSON.parse(localStorage.getItem(SAVE_KEY) || '{}')); } catch { return def; }
})();
const persist = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch {} };

const round5 = v => Math.max(5, Math.round(v / 5) * 5);
const layersFor = n => Math.min(18, 10 + 2 * Math.floor((n - 1) / 2));
const targetFor = n => round5(25 * Math.pow(1.3, n - 1));
const starGoals = n => { const t = targetFor(n); return [t, round5(t * 1.6), round5(t * 2.4)]; };
const levelScale = n => 1 + 0.25 * (n - 1);
const crackChance = n => n === 1 ? 0 : n === 2 ? 0.05 : 0.08;

const COLORS = [
  { key: 'red',    base: '#ff3b5c', dark: '#b8103a', light: '#ffa3b4' },
  { key: 'yellow', base: '#ffcc1f', dark: '#d07a00', light: '#fff3a0' },
  { key: 'green',  base: '#35d65b', dark: '#118a35', light: '#b4f9b8' },
  { key: 'blue',   base: '#2b9dff', dark: '#124fc9', light: '#a9dcff' },
  { key: 'purple', base: '#a65bff', dark: '#5f20c4', light: '#dcc0ff' },
];
const SPECIAL = {
  star: { key: 'star', base: '#ffd21f', dark: '#d97800', light: '#fffbd0' },
  gem:  { key: 'gem',  base: '#c9f1ff', dark: '#3f8fe8', light: '#ffffff' },
};
const BOOSTERS = {
  freeze: { name: 'Freeze', price: 60, icon: 'i-freeze' },
  xray:   { name: 'X-Ray',  price: 40, icon: 'i-xray' },
  shield: { name: 'Shield', price: 50, icon: 'i-shield' },
};
const COMBO_WORDS = ['', '', 'Nice!', 'Sweet!', 'Amazing!', 'Incredible!', 'UNSTOPPABLE!'];

// ---------- state ----------
const S = {
  mode: 'menu', potCoins: 0, potMult: 1, combo: 0, lastColor: null, starsShown: 0,
  blocks: [], popping: [], pulling: null, pulls: 0, layers: 10,
  xray: false, shield: false, freezeT: 0, tutTarget: null, tutPulls: 0,
};
const potValue = () => Math.round(S.potCoins * S.potMult);
const starsReached = () => starGoals(save.level).filter(g => potValue() >= g).length;

// ---------- audio ----------
const audio = (() => {
  let ctx = null;
  function ensure() {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch { return; } }
    if (ctx.state === 'suspended') ctx.resume();
  }
  function tone(freq, dur, type = 'sine', vol = 0.15, slide = 0, delay = 0) {

    btn.type = 'button'; btn.className = 'boost' + (active ? ' active' : '');
    btn.setAttribute('aria-label', `${bz.name}: ${n > 0 ? n + ' left' : bz.price + ' coins'}`);
    btn.innerHTML = `<svg><use href="#${bz.icon}"/></svg><span class="badge${n > 0 ? '' : ' price'}">${n > 0 ? n : bz.price}</span><span class="boost-name">${bz.name}</span>`;
    btn.onclick = () => useBooster(key);
    wrap.append(btn);
  }
}

// ---------- level flow ----------
let winLevel = 1;
function startLevel() {
  for (const id of ['menu', 'win', 'lose']) $(id).hidden = true;
  S.potCoins = 0; S.potMult = 1; S.combo = 0; S.lastColor = null; S.starsShown = 0;
  S.xray = false; S.shield = false; S.tutPulls = 0; meter = 0; overFor = 0;
  $('vig').className = '';
  buildTower();
  S.mode = 'play'; controls.autoRotate = false;
  $('top').hidden = false; $('dock').hidden = false;
  renderStarsBar(); renderBoosters(); updateHUD(); hideTip();
  if (save.tut === 0) { // point at a safe middle block
    S.tutTarget = S.blocks.filter(b => b.layer === 3)[1];
    showTip('Tap a block to slide it out!', 0, null, true);
  }
}

function bank() {
  if (S.mode !== 'play' || starsReached() < 1) return;
  const stars = starsReached(), coins = potValue(), lvl = save.level;
  S.mode = 'won'; hideTip(); audio.bank(); buzz(30);
  save.wallet += coins;
  save.stars[lvl] = Math.max(save.stars[lvl] || 0, stars);
  save.level = lvl + 1; winLevel = lvl;
  if (save.tut === 3) save.tut = 4;
  persist();
  $('winTitle').textContent = `Level ${lvl} Complete!`;
  $('winCoins').textContent = coins;
  $('winText').textContent = stars < 3 ? `Reach ${starGoals(lvl)[stars]} for ${stars + 1} stars.` : 'Perfect! All 3 stars.';
  $('replay').hidden = stars >= 3;
  const bs = $('bigstars'); bs.replaceChildren();
  for (let i = 0; i < 3; i++) {
    const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('viewBox', '0 0 24 24'); s.innerHTML = '<use href="#i-star"/>';
    if (i < stars) { s.classList.add('on'); s.style.animationDelay = `${0.25 + i * 0.3}s`; setTimeout(() => audio.star(), 250 + i * 300); }
    bs.append(s);
  }
  $('dock').hidden = true; $('top').hidden = true; $('win').hidden = false;
  confetti(); updateHUD();
}

function showMenu() {
  S.mode = 'menu'; controls.autoRotate = !reduceMotion;
  $('top').hidden = true; $('dock').hidden = true; hideTip();
  for (const id of ['win', 'lose']) $(id).hidden = true;
  $('menu').hidden = false;
  $('menuWallet').textContent = save.wallet;
  $('play').textContent = `PLAY · Level ${save.level}`;
}

// ---------- HUD ----------
function renderStarsBar() {
  const bar = $('bar'); bar.querySelectorAll('.star').forEach(e => e.remove());
  const goals = starGoals(save.level);
  goals.forEach((g, i) => {
    const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('viewBox', '0 0 24 24'); s.classList.add('star'); s.innerHTML = '<use href="#i-star"/>';
    s.style.left = i === 2 ? 'calc(100% - 8px)' : `${g / goals[2] * 100}%`; s.dataset.i = i;
    bar.append(s);
  });
}
function updateHUD() {
  const goals = starGoals(save.level), v = potValue(), st = starsReached();
  $('lvl').textContent = save.level;
  $('wallet').textContent = save.wallet;
  $('pot').textContent = v;
  $('mult').hidden = S.potMult === 1; $('mult').textContent = `×${S.potMult.toFixed(1)}`;
  $('fill').style.width = Math.min(100, v / goals[2] * 100) + '%';
  $('goalTxt').textContent = st >= 3 ? `${v} · 3 stars!` : `${v} / ${goals[st]}`;
  $('bar').querySelectorAll('.star').forEach(s => s.classList.toggle('on', +s.dataset.i < st));
  const bankBtn = $('bank'), ok = st >= 1 && S.mode === 'play';
  bankBtn.disabled = !ok; bankBtn.classList.toggle('ready', ok);
  $('bankSub').textContent = st >= 1 ? `+${v} coins` : `Goal ${goals[0]}`;
}
function updateStability() {
  const s = Math.max(0, 1 - meter);
  const el = $('stab');
  el.style.width = (s * 100) + '%';
  el.style.background = s > 0.6 ? 'var(--green-1)' : s > 0.35 ? 'var(--gold-1)' : 'var(--danger)';
  const warn = s <= 0.4 && S.freezeT <= 0 && (S.mode === 'play' || S.mode === 'pulling');
  $('careful').classList.toggle('on', warn);
  if (S.freezeT <= 0) $('vig').className = warn ? 'danger' : '';
}

// ---------- feedback ----------
let toastTimer = 0;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2400);
}
let tipTimer = 0, tipEl = null;
function showTip(text, ms = 0, anchorEl = null, ringOnTarget = false) {
  $('tip').textContent = text; $('tip').hidden = false;
  tipEl = anchorEl; $('ring').hidden = !(anchorEl || ringOnTarget);
  if (!ringOnTarget) S.tutTarget = null;
  clearTimeout(tipTimer); if (ms) tipTimer = setTimeout(hideTip, ms);
}
function hideTip() { $('tip').hidden = true; $('ring').hidden = true; tipEl = null; S.tutTarget = null; }

function toScreen(pos3) { const v = pos3.clone().project(camera); return [(v.x + 1) / 2 * innerWidth, (1 - v.y) / 2 * innerHeight]; }
function pop(pos3, text, color) {
  const [x, y] = toScreen(pos3);
  const el = document.createElement('div');
  el.className = 'pop gt'; el.textContent = text; el.style.color = color;
  el.style.left = x + 'px'; el.style.top = y + 'px';
  document.body.append(el); setTimeout(() => el.remove(), 1100);
}
function comboText(big, small) {
  const el = $('combo');
  el.replaceChildren(big);
  if (small) { const s = document.createElement('small'); s.textContent = small; el.append(s); }
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
}
function flyCoins(pos3, n) {
  const [x, y] = toScreen(pos3), target = $('handCoin').getBoundingClientRect();
  const tx = target.left + target.width / 2, ty = target.top + target.height / 2;
  for (let i = 0; i < n; i++) {
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    c.classList.add('flycoin'); c.innerHTML = '<use href="#i-coin"/>';
    c.style.left = x + 'px'; c.style.top = y + 'px';
    document.body.append(c);
    const sx = (Math.random() - 0.5) * 120, sy = -40 - Math.random() * 80;
    const anim = c.animate([
      { transform: 'translate(0,0) scale(.6)' },
      { transform: `translate(${sx}px,${sy}px) scale(1.1)`, offset: 0.35 },
      { transform: `translate(${tx - x}px,${ty - y}px) scale(.7)` },
    ], { duration: 700, delay: i * 60, easing: 'cubic-bezier(.5,0,.6,1)', fill: 'forwards' });
    anim.onfinish = () => { c.remove(); audio.coin(i); $('handCoin').animate([{ transform: 'scale(1.35)' }, { transform: 'scale(1)' }], { duration: 160 }); };
  }
}
function confetti() {
  if (reduceMotion) return;
  const cols = ['#ff3b5c', '#ffcc1f', '#35d65b', '#2b9dff', '#a65bff', '#ffffff'];
  for (let i = 0; i < 70; i++) {
    const c = document.createElement('div'); c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw'; c.style.background = cols[i % cols.length];
    document.body.append(c);
    const dx = (Math.random() - 0.5) * 200, rot = Math.random() * 720;
    c.animate([{ transform: 'translate(0,0) rotate(0)' }, { transform: `translate(${dx}px,${innerHeight + 60}px) rotate(${rot}deg)` }],
      { duration: 1800 + Math.random() * 1400, delay: Math.random() * 400, easing: 'cubic-bezier(.3,.6,.6,1)', fill: 'forwards' }).onfinish = () => c.remove();
  }
}

const particles = [], pGeo = new THREE.OctahedronGeometry(0.1), whiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true });
function burst(pos, color, n) {
  const mat = new THREE.MeshBasicMaterial({ color, transparent: true });
  for (let i = 0; i < n; i++) {
    const m = new THREE.Mesh(pGeo, i % 3 ? mat : whiteMat); m.position.copy(pos); scene.add(m);
    particles.push({ m, life: 0.9, v: new THREE.Vector3((Math.random() - .5) * 7, Math.random() * 6 + 2, (Math.random() - .5) * 7), spin: Math.random() * 10 });
  }
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i]; p.life -= dt; p.v.y -= 12 * dt;
    p.m.position.addScaledVector(p.v, dt); p.m.rotation.x += p.spin * dt; p.m.rotation.y += p.spin * dt;
    p.m.scale.setScalar(Math.max(0.01, p.life / 0.9));
    if (p.life <= 0) { scene.remove(p.m); particles.splice(i, 1); }
  }
  for (let i = S.popping.length - 1; i >= 0; i--) { // pulled block swells, then pops
    const p = S.popping[i]; p.t += dt;
    const k = p.t < 0.08 ? 1 + p.t * 3 : Math.max(0, 1.24 - (p.t - 0.08) * 6);
    p.mesh.scale.setScalar(k);
    if (k <= 0) { scene.remove(p.mesh); S.popping.splice(i, 1); }
  }
}

// ---------- input ----------
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let hovered = null, down = null;
function setHover(blk) {
  if (hovered === blk) return;
  if (hovered) { hovered.outline.visible = !!(hovered.cracked && S.xray); hovered.outline.material = crackMat; }
  hovered = blk;
  if (blk) { blk.outline.material = hoverMat; blk.outline.visible = true; }
}
function pick(e) {
  const r = canvas.getBoundingClientRect();
  ndc.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(S.blocks.map(b => b.mesh), false);
  return hits.length ? hits[0].object.userData.blk : null;
}
canvas.addEventListener('pointerdown', e => {
  audio.ensure(); down = { x: e.clientX, y: e.clientY, t: performance.now() };
  if (S.mode === 'play' && e.pointerType !== 'mouse') setHover(pick(e));
});
canvas.addEventListener('pointerup', e => {
  if (!down) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), quick = performance.now() - down.t < 500;
  down = null;
  if (e.pointerType !== 'mouse') setHover(null);
  if (moved < 10 && quick && S.mode === 'play') { const blk = pick(e); if (blk) startPull(blk); }
});
canvas.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse') { if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 10) setHover(null); return; }
  setHover(S.mode === 'play' ? pick(e) : null);
  canvas.classList.toggle('hot', !!hovered);
});
$('bank').onclick = bank;
addEventListener('keydown', e => { if ((e.key === 'b' || e.key === 'B') && S.mode === 'play') bank(); });
$('play').onclick = () => { audio.ensure(); audio.click(); startLevel(); };
$('next').onclick = () => { audio.click(); startLevel(); };
$('replay').onclick = () => { audio.click(); save.level = winLevel; persist(); startLevel(); };
$('retry').onclick = () => { audio.click(); startLevel(); };
$('toMenu').onclick = () => { audio.click(); showMenu(); };
function renderMute() {
  $('mute').innerHTML = `<svg><use href="#${save.muted ? 'i-mute' : 'i-sound'}"/></svg>`;
  $('mute').setAttribute('aria-label', save.muted ? 'Sound off' : 'Sound on');
}
$('mute').onclick = () => { save.muted = !save.muted; persist(); renderMute(); audio.ensure(); audio.click(); };

// ---------- loop ----------
let last = performance.now();
const shakeOff = new THREE.Vector3();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  stepQuake(dt * timeScale);
  world.step(1 / 120, dt * timeScale, 10);
  syncMeshes();

  if (S.pulling) {
    const b = S.pulling.body, s = S.pulling.pullStart;
    if (Math.hypot(b.position.x - s.x, b.position.z - s.z) >= S.pulling.pullDist) finishPull();
  }
  if (S.freezeT > 0) {
    S.freezeT -= dt;
    if (S.freezeT <= 0) { setFrozen(false); renderBoosters(); toast('Freeze wore off.'); }
  }
  if ((S.mode === 'play' || S.mode === 'pulling') && S.freezeT <= 0) {
    const w = measureDanger();
    meter = Math.max(w, meter * 0.95);
    overFor = w >= 1 ? overFor + dt : 0; // must stay past the limit briefly, so a rattle isn't a collapse
    if (overFor > 0.35) { overFor = 0; topple(); }
  }
  if (S.mode === 'play' || S.mode === 'pulling') updateStability();

  const t = now / 1000;
  crackMat.opacity = 0.55 + 0.4 * Math.sin(t * 6);
  if (S.xray) for (const b of S.blocks) if (b.cracked && b !== hovered) { b.outline.material = crackMat; b.outline.visible = true; }
  if (S.tutTarget && S.blocks.includes(S.tutTarget)) {
    const [x, y] = toScreen(S.tutTarget.mesh.position);
    $('ring').style.left = x + 'px'; $('ring').style.top = y + 'px';
  } else if (tipEl) {
    const r = tipEl.getBoundingClientRect();
    $('ring').style.left = (r.left + r.width / 2) + 'px'; $('ring').style.top = (r.top + r.height / 2) + 'px';
  }

  updateParticles(dt);
  controls.update();
  if (shake > 0) {
    shake = Math.max(0, shake - dt * 0.3);
    shakeOff.set((Math.random() - .5) * shake, (Math.random() - .5) * shake, (Math.random() - .5) * shake);
    camera.position.add(shakeOff); renderer.render(scene, camera); camera.position.sub(shakeOff);
  } else renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

window.topple = { S, save, startPull, bank, startLevel, measureDanger };
renderMute();
buildTower();
showMenu();
requestAnimationFrame(frame);
</script>
