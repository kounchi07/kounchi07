<title>Topple</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: candy-puzzle look. Level map is the home screen; in a level the 3D tower is full-bleed with
   HUD (pulls left, goal bar with 3 stars, wallet) on top and hand + BANK + boosters docked bottom.
   Single bright look by design (no light/dark split). */
:root{
  --sky-top:#3d4be6; --sky-bot:#6b2fd3; --night:#24138a;
  --ink:#ffffff; --ink-dim:#d9dcff;
  --green-1:#8cf55f; --green-2:#26b83a; --green-sh:#157a27;
  --gold-1:#ffe45c; --gold-2:#ffad0f; --gold-sh:#b86a00;
  --pink-1:#ff7cc0; --pink-2:#e8287a; --pink-sh:#9c0f52;
  --blue-1:#7fc4ff; --blue-2:#3a72ff; --blue-sh:#1e3fae;
  --plum-1:#c58bff; --plum-2:#7a2fe0; --plum-sh:#4a1696;
  --danger:#ff3b5c;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:linear-gradient(180deg,var(--sky-top),var(--sky-bot));color:var(--ink);font-family:var(--body);font-weight:800;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#gl.hot{cursor:pointer}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid var(--gold-1);outline-offset:3px}
svg{display:block}

.gt{font-family:var(--display);color:#fff;letter-spacing:.02em;
  text-shadow:0 3px 0 var(--night),2px 2px 0 var(--night),-2px 2px 0 var(--night),2px -2px 0 var(--night),-2px -2px 0 var(--night),0 6px 10px rgba(0,0,0,.35)}

.btn{font-family:var(--display);font-size:24px;color:#fff;border-radius:18px;padding:13px 26px;position:relative;
  box-shadow:0 6px 0 var(--sh),inset 0 3px 0 rgba(255,255,255,.5);text-shadow:0 2px 0 rgba(0,0,0,.25);transition:transform .06s,box-shadow .06s}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 var(--sh),inset 0 3px 0 rgba(255,255,255,.5)}
.btn.green{background:linear-gradient(180deg,var(--green-1),var(--green-2));--sh:var(--green-sh)}
.btn.blue{background:linear-gradient(180deg,var(--blue-1),var(--blue-2));--sh:var(--blue-sh)}
.btn.gold{background:linear-gradient(180deg,var(--gold-1),var(--gold-2));--sh:var(--gold-sh);color:#5a2d00;text-shadow:none}
.btn.small{font-size:18px;padding:9px 18px;border-radius:14px}
.btn:disabled{background:linear-gradient(180deg,#a9acd6,#7d80b8);--sh:#53568c;color:#eef}
.close{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;background:linear-gradient(180deg,#ff7a8e,#e8203f);border:3px solid #fff;box-shadow:0 3px 0 #9c0f2a;font-family:var(--display);font-size:18px;line-height:1}

/* in-level HUD */
.top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px;pointer-events:none}
.top > *{pointer-events:auto}
.moves{flex:none;width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--pink-1),var(--pink-2));border:3px solid #fff;box-shadow:0 4px 0 var(--pink-sh);display:grid;place-items:center;line-height:1;text-align:center}
.moves small{display:block;font-family:var(--body);font-size:9px;letter-spacing:.08em}
.moves b{font-family:var(--display);font-size:24px;font-weight:400}
.moves.low{background:radial-gradient(circle at 35% 30%,#ff9aa8,#e8203f);animation:pulse .6s infinite}
.goal{flex:1;min-width:0;max-width:460px;margin-inline:auto}
.goal .label{display:flex;justify-content:space-between;font-size:12px;margin:0 4px 6px;color:var(--ink-dim)}
.bar{position:relative;height:20px;border-radius:999px;background:rgba(20,8,90,.55);border:3px solid #fff;box-shadow:0 3px 0 rgba(20,8,90,.5)}
.bar .fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:999px;background:linear-gradient(180deg,#fff27a,#ffb20f);transition:width .35s cubic-bezier(.3,1.4,.5,1)}
.bar .fill::after{content:"";position:absolute;left:6px;right:6px;top:2px;height:4px;border-radius:9px;background:rgba(255,255,255,.65)}
.star{position:absolute;top:50%;width:30px;height:30px;transform:translate(-50%,-55%)}
.star use{fill:#5d58a8;stroke:#fff;stroke-width:1.6;stroke-linejoin:round}
.star.on use{fill:#ffd21f}
.star.on{animation:starpop .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes starpop{0%{transform:translate(-50%,-55%) scale(.4)}100%{transform:translate(-50%,-55%) scale(1)}}
.pill{flex:none;display:flex;align-items:center;gap:6px;background:rgba(20,8,90,.55);border:2px solid rgba(255,255,255,.55);border-radius:999px;padding:3px 12px 3px 3px;font-family:var(--display);font-size:19px;font-variant-numeric:tabular-nums}
.coin{width:24px;height:24px;flex:none}
.roundbtn{width:40px;height:40px;border-radius:50%;background:rgba(20,8,90,.55);border:2px solid rgba(255,255,255,.55);display:grid;place-items:center;flex:none;position:relative}
.roundbtn svg{width:22px;height:22px}
.roundbtn .dot{position:absolute;top:-3px;right:-3px;width:14px;height:14px;border-radius:50%;background:var(--danger);border:2px solid #fff}

.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:min(500px,calc(100% - 24px));display:grid;gap:10px}
.stab{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim)}
.stab .track{flex:1;height:10px;border-radius:99px;background:rgba(20,8,90,.55);border:2px solid rgba(255,255,255,.5);overflow:hidden}
.stab .track i{display:block;height:100%;width:100%;border-radius:99px;background:var(--green-1);transition:background .2s}
.stab b{font-family:var(--display);font-weight:400;font-size:15px;letter-spacing:.04em;color:var(--danger);text-transform:none;opacity:0;transition:opacity .2s}
.stab b.on{opacity:1;animation:wig .3s infinite alternate}
@keyframes wig{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.handrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.08));border:3px solid rgba(255,255,255,.6);border-radius:22px;padding:10px 12px;box-shadow:0 6px 0 rgba(20,8,90,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hand{display:flex;align-items:center;gap:10px;min-width:0}
.hand .coin{width:40px;height:40px}
.hand .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim)}
.hand .n{font-size:32px;line-height:1}
.mult{font-family:var(--display);font-size:16px;background:linear-gradient(180deg,var(--gold-1),var(--gold-2));color:#5a2d00;border-radius:10px;padding:2px 8px;box-shadow:0 3px 0 var(--gold-sh)}
#bank{min-width:128px;font-size:26px;line-height:1.05}
#bank small{display:block;font-family:var(--body);font-size:12px;letter-spacing:.06em;opacity:.95}
#bank.ready{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.2)}}
.boosts{display:flex;justify-content:center;gap:18px}
.boost{width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--blue-1),var(--blue-2));border:3px solid #fff;box-shadow:0 4px 0 var(--blue-sh);display:grid;place-items:center;position:relative}
.boost:active{transform:translateY(3px);box-shadow:0 1px 0 var(--blue-sh)}
.boost svg{width:30px;height:30px}
.badge{position:absolute;top:-6px;right:-8px;min-width:24px;height:24px;border-radius:12px;padding:0 6px;background:linear-gradient(180deg,#ff6b81,#e8203f);border:2px solid #fff;font-family:var(--display);font-size:14px;display:grid;place-items:center}
.badge.price{background:linear-gradient(180deg,var(--gold-1),var(--gold-2));color:#5a2d00}
.boost.active{box-shadow:0 4px 0 var(--blue-sh),0 0 0 4px var(--gold-1),0 0 24px var(--gold-1)}
.boost-name{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;color:var(--ink-dim)}

#tip{position:fixed;top:calc(env(safe-area-inset-top,0px) + 86px);left:50%;transform:translateX(-50%);width:min(380px,calc(100% - 32px));background:#fff;color:#2b1a8a;border-radius:18px;padding:12px 16px;text-align:center;font-size:16px;line-height:1.35;box-shadow:0 6px 0 rgba(20,8,90,.45);animation:bob 1.6s ease-in-out infinite;z-index:3}
@keyframes bob{50%{transform:translate(-50%,4px)}}
#ring{position:fixed;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;border:4px solid #fff;pointer-events:none;box-shadow:0 0 0 3px rgba(43,26,138,.6);animation:tap 1s ease-out infinite;z-index:3}
@keyframes tap{0%{transform:scale(1.4);opacity:0}40%{opacity:1}100%{transform:scale(.7);opacity:0}}

/* overlays + panels */
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(24,10,90,.6);padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-y:auto;z-index:10}
.panel{width:min(380px,100%);margin:auto;background:linear-gradient(180deg,#6474ff,#4130c9);border:4px solid #fff;border-radius:28px;box-shadow:0 10px 0 var(--night),0 24px 50px rgba(0,0,0,.35);padding:44px 20px 22px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;position:relative;animation:panelin .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes panelin{from{transform:scale(.7);opacity:0}}
.ribbon{position:absolute;top:-26px;left:50%;transform:translateX(-50%);white-space:nowrap;background:linear-gradient(180deg,var(--pink-1),var(--pink-2));border:3px solid #fff;border-radius:16px;padding:8px 22px;box-shadow:0 6px 0 var(--pink-sh);font-size:26px}
.ribbon.bad{background:linear-gradient(180deg,#ff7a8e,#e8203f);box-shadow:0 6px 0 #9c0f2a}
.ribbon.hard{background:linear-gradient(180deg,var(--plum-1),var(--plum-2));box-shadow:0 6px 0 var(--plum-sh)}
.panel p{margin:0;color:var(--ink-dim);line-height:1.4;font-size:16px}
.bigstars{display:flex;gap:6px;align-items:flex-end}
.bigstars svg{width:64px;height:64px}
.bigstars svg:nth-child(2){width:80px;height:80px}
.bigstars use{fill:#3a2c9a;stroke:#fff;stroke-width:1.4;stroke-linejoin:round}
.bigstars svg.on use{fill:#ffd21f}
.bigstars svg.on{animation:bigpop .45s cubic-bezier(.3,1.8,.5,1) both}
.bigstars.static svg.on{animation:none}
@keyframes bigpop{from{transform:scale(0) rotate(-40deg)}}
.reward{display:flex;align-items:center;gap:8px;font-size:30px}
.reward .coin{width:34px;height:34px}
.col{display:flex;flex-direction:column;gap:12px;width:100%}
.goalcard{width:100%;background:rgba(20,8,90,.35);border-radius:16px;padding:12px;display:grid;gap:4px}
.goalcard b{font-family:var(--display);font-weight:400;font-size:28px;color:#ffd21f}
.feats{display:grid;gap:8px;width:100%;text-align:left}
.feat{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.12);border-radius:12px;padding:8px 10px;font-size:14px;line-height:1.3}
.feat svg{width:28px;height:28px;flex:none}

/* level map */
#map{position:fixed;inset:0;display:flex;flex-direction:column;background:linear-gradient(180deg,#5fd0ff 0%,#6f86ff 35%,#9a5cf0 70%,#d24fc7 100%);z-index:5}
.maphead{flex:none;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px));background:linear-gradient(180deg,rgba(36,19,138,.75),rgba(36,19,138,0))}
.maphead .logo{font-family:var(--display);font-size:30px;color:#ffd21f;margin-right:auto;text-shadow:0 3px 0 #e8287a,2px 2px 0 #e8287a,-2px 2px 0 #e8287a,2px -2px 0 #e8287a,-2px -2px 0 #e8287a,0 5px 0 var(--night)}
.mapscroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.track{position:relative;width:min(440px,100%);margin:0 auto}
.track svg.path{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.node{position:absolute;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;display:grid;place-items:center;border:4px solid #fff;
  background:radial-gradient(circle at 35% 30%,var(--pink-1),var(--pink-2));box-shadow:0 6px 0 var(--pink-sh),0 10px 16px rgba(0,0,0,.25)}
.node .num{font-family:var(--display);font-size:24px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.node.hard{background:radial-gradient(circle at 35% 30%,var(--plum-1),var(--plum-2));box-shadow:0 6px 0 var(--plum-sh),0 10px 16px rgba(0,0,0,.25)}
.node.locked{background:radial-gradient(circle at 35% 30%,#dcdaf0,#9d99c9);box-shadow:0 6px 0 #67639b;color:#67639b;cursor:default}
.node.locked svg{width:24px;height:24px}
.node.current{width:78px;height:78px;margin:-39px 0 0 -39px;background:radial-gradient(circle at 35% 30%,var(--gold-1),var(--gold-2));box-shadow:0 6px 0 var(--gold-sh),0 0 0 6px rgba(255,255,255,.35),0 12px 20px rgba(0,0,0,.3);animation:hop 1.1s ease-in-out infinite}
.node.current .num{font-size:30px}
@keyframes hop{50%{transform:translateY(-8px)}}
.node .nstars{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);display:flex;gap:1px}
.node .nstars svg{width:17px;height:17px}
.node .nstars use{fill:#5d58a8;stroke:#fff;stroke-width:2}
.node .nstars svg.on use{fill:#ffd21f}
.node .tag{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-family:var(--display);font-size:11px;letter-spacing:.06em;background:var(--plum-2);border:2px solid #fff;border-radius:8px;padding:1px 6px;white-space:nowrap}
.deco{position:absolute;border-radius:50%;pointer-events:none}
.cloud{position:absolute;height:34px;border-radius:30px;background:rgba(255,255,255,.55);pointer-events:none}

/* daily rewards */
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.day{position:relative;border-radius:14px;background:rgba(255,255,255,.14);border:3px solid rgba(255,255,255,.45);padding:8px 4px 6px;display:grid;justify-items:center;gap:2px;font-size:12px;min-width:0}
.day .dn{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim)}
.day svg{width:30px;height:30px}
.day .amt{font-family:var(--display);font-size:15px;line-height:1.1}
.day.big{grid-column:span 2}
.day.claimed{opacity:.5}
.day.claimed::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:36px;color:#8cf55f;text-shadow:0 2px 0 var(--green-sh)}
.day.today{background:linear-gradient(180deg,var(--gold-1),var(--gold-2));border-color:#fff;color:#5a2d00;animation:pulse 1s infinite}
.day.today .dn{color:#7a4300}

/* in-world feedback */
.pop{position:fixed;transform:translate(-50%,-50%);font-size:28px;pointer-events:none;animation:rise 1s ease-out forwards;white-space:nowrap;z-index:2}
@keyframes rise{0%{opacity:0;margin-top:10px;scale:.6}15%{opacity:1;scale:1.15}30%{scale:1}100%{opacity:0;margin-top:-80px}}
#combo{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-size:clamp(40px,11vw,64px);pointer-events:none;text-align:center;line-height:1;opacity:0;white-space:nowrap;z-index:2}
#combo.show{animation:combo 1.1s cubic-bezier(.3,1.6,.5,1) forwards}
#combo small{display:block;font-size:.5em;color:#ffd21f}
@keyframes combo{0%{transform:translate(-50%,-50%) scale(0) rotate(-12deg);opacity:1}25%{transform:translate(-50%,-50%) scale(1.1) rotate(3deg);opacity:1}40%{transform:translate(-50%,-50%) scale(1) rotate(0);opacity:1}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
.flycoin{position:fixed;width:26px;height:26px;margin:-13px 0 0 -13px;pointer-events:none;z-index:20}
#vig{position:fixed;inset:0;pointer-events:none;transition:box-shadow .3s}
#vig.danger{box-shadow:inset 0 0 110px 20px rgba(255,40,80,.55)}
#vig.frozen{box-shadow:inset 0 0 110px 26px rgba(120,220,255,.75)}
#vig.gust{box-shadow:inset 0 0 90px 10px rgba(255,200,120,.5)}
.confetti{position:fixed;top:-20px;width:10px;height:16px;border-radius:3px;pointer-events:none;z-index:15}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 86px);left:50%;transform:translateX(-50%);background:var(--night);border:2px solid #fff;padding:8px 16px;border-radius:14px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center;width:max-content;max-width:calc(100% - 32px);z-index:30}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>

    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="3" fill="currentColor"/><path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="2.6" fill="none"/></symbol>

const SAVE_KEY = 'topple-v3';

})();

const todayKey = () => { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);

// Every level is fixed (same tower each time) and gets harder: tighter goal per pull, more cracks,
// then stone blocks (level 4+), wind gusts (level 8+), and a Hard level every 5th.
function levelConfig(n) {
  const hard = n >= 5 && n % 5 === 0;
  const layers = Math.min(18, 10 + 2 * Math.floor((n - 1) / 3));
  const moves = (n <= 3 ? 10 : 12) - (hard ? 1 : 0);
  const scale = 1 + 0.15 * (n - 1);
  const tight = Math.min(1.1, 0.72 + 0.025 * (n - 1)) + (hard ? 0.12 : 0);
  const t = round5(moves * 4.3 * scale * tight);
  return {
    n, hard, layers, moves, scale, goals: [t, round5(t * 1.5), round5(t * 2.1)],
    crack: n <= 2 ? 0 : Math.min(0.14, 0.04 + 0.006 * n),
    stone: n >= 4 ? Math.min(0.2, 0.06 + 0.01 * (n - 4)) : 0,
    wind: n >= 8 ? Math.min(1, 0.45 + 0.05 * (n - 8)) : 0,

  blocks: [], popping: [], pulling: null, pulls: 0, movesLeft: 10, layers: 10,

// ---------- audio: soft candy palette through a limiter ----------
const audio = (() => {
  let ctx = null, out = null, noiseBuf = null;

    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  return {
    ensure,
    pull() { tone(520, 0.09, 'triangle', 0.09, 1.5); swish(0.32, 0.07, 500, 2600, 0.02); },
    pop(combo) { // bubbly "bloop" that climbs with the combo

      tone(b * 0.6, 0.14, 'sine', 0.16, 2); tone(b * 2, 0.18, 'triangle', 0.05, 1, 0.05);
    },
    coin(i) { tone(1568 * semi((i % 4) * 2), 0.07, 'triangle', 0.05); },
    star() { [0, 4, 7, 12].forEach((s, i) => tone(784 * semi(s), 0.28, 'triangle', 0.08, 1, i * 0.06)); },
    gem() { [0, 7, 12, 19, 24].forEach((s, i) => tone(988 * semi(s), 0.22, 'sine', 0.08, 1, i * 0.045)); },
    mult() { tone(392, 0.3, 'triangle', 0.08, 2); tone(784, 0.3, 'sine', 0.06, 1.5, 0.06); },
    crack() { tone(160, 0.5, 'triangle', 0.14, 0.45); swish(0.6, 0.18, 300, 120); },
    boom() { tone(90, 1.1, 'sine', 0.3, 0.4); swish(1.2, 0.3, 400, 80); },
    gust() { tone(55, 1.4, 'sine', 0.25, 1.1); swish(1.4, 0.12, 200, 90); },
    bank() { [0, 4, 7, 12, 16, 19, 24].forEach((s, i) => tone(523 * semi(s), 0.24, 'triangle', 0.08, 1, i * 0.07)); },
    click() { tone(660, 0.05, 'triangle', 0.06, 1.3); },
    thunk() { tone(140, 0.15, 'sine', 0.14, 0.7); },
    shield() { tone(1200, 0.35, 'sine', 0.08, 0.5); },

const scene = new THREE.Scene();
{ // candy sky gradient with soft bokeh

  const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 1024);

const plate = new THREE.Group(); scene.add(plate);
{ // frosted cake-plate pedestal
  const top = new THREE.Mesh(new THREE.CylinderGeometry(3.6, 3.6, 0.5, 64),

  rim.rotation.x = Math.PI / 2; rim.position.y = -0.25; plate.add(rim);

    new THREE.MeshStandardMaterial({ color: 0xa36bff, roughness: 0.35 }));
  base.position.y = -1.3; plate.add(base);
  const dotGeo = new THREE.SphereGeometry(0.09, 10, 8);
  for (let i = 0; i < 36; i++) {

  }

function fitCamera() { // pull back for tall towers and on tall, narrow screens so the whole tower fits
  const off = camera.position.clone().sub(controls.target);
  const tall = Math.max(1, S.layers * BH / 7.2);
  off.setLength(Math.min(controls.maxDistance, Math.max(20, 10.5 / camera.aspect) * tall));

// ---------- physics ----------
const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.82, 0), allowSleep: true });

world.solver.iterations = 25;

// ---------- candy block textures ----------
function mixHex(a, b, t) {

}
function rr(g, x, y, w, h, r) {

  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);

  g.stroke(); g.fillStyle = '#5fd0ff'; g.fill();
  g.beginPath(); g.moveTo(cx - w, cy - h * 0.35); g.lineTo(cx + w, cy - h * 0.35); g.lineTo(cx, cy + h); g.closePath();
  g.fillStyle = '#2b9dff'; g.fill();
  g.beginPath(); g.moveTo(cx - w * 0.5, cy - h * 0.8); g.lineTo(cx - w * 0.1, cy - h * 0.35); g.lineTo(cx - w * 0.75, cy - h * 0.35); g.closePath();

}
function drawRivets(g, w, h, s) {
  const r = s * 0.07, m = s * 0.24;

    g.fillStyle = '#5b627e'; g.beginPath(); g.arc(x, y + r * 0.3, r, 0, Math.PI * 2); g.fill();

// ---------- tower ----------
const blockGeo = new THREE.BoxGeometry(BW, BH, BD);
const outlineGeo = new THREE.BoxGeometry(BW + 0.12, BH + 0.12, BD + 0.12);
const hoverMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.BackSide });
const crackMat = new THREE.MeshBasicMaterial({ color: 0xff2050, side: THREE.BackSide, transparent: true, opacity: 0.9 });

function rollBlock(cfg, rng, layer) {
  const r = rng();
  if (layer > 0 && r < cfg.stone) return { kind: 'stone', pal: SPECIAL.stone };
  const r2 = rng();
  if (r2 < 0.06) return { kind: 'star', pal: SPECIAL.star };
  if (r2 < 0.11) return { kind: 'gem', pal: SPECIAL.gem };
  const c = COLORS[Math.floor(rng() * COLORS.length)];
  return { kind: 'color', pal: c, cracked: rng() < cfg.crack };
}

let hovered = null;
function clearTower() {
  for (const b of S.blocks) { world.removeBody(b.body); scene.remove(b.mesh); }
  for (const p of S.popping) scene.remove(p.mesh);
  S.blocks = []; S.popping = []; S.pulling = null; hovered = null;
}

let quake = null;
function buildTower(cfg) {
  clearTower();
  quake = null; ground.velocity.set(0, 0, 0); ground.position.set(0, -0.3, 0); plate.position.set(0, 0, 0);
  S.pulls = 0; S.freezeT = 0; S.gustT = 7;
  const rng = mulberry32(cfg.n * 9973 + 7);
  const L = cfg.layers; S.layers = L;
  for (let i = 0; i < L; i++) {
    const alongX = i % 2 === 0;
    for (let j = -1; j <= 1; j++) {
      const off = j * (BD + GAP);
      const body = new CANNON.Body({ mass: 1, material: blockMat, shape: new CANNON.Box(new CANNON.Vec3(BW / 2, BH / 2, BD / 2)) });
      body.position.set(alongX ? 0 : off, BH / 2 + i * BH, alongX ? off : 0);
      if (!alongX) body.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), Math.PI / 2);
      body.linearDamping = 0.05; body.angularDamping = 0.12;
      body.sleepSpeedLimit = 0.06; body.sleepTimeLimit = 0.3;
      world.addBody(body); body.sleep();

      const info = rollBlock(cfg, rng, i);
      const mesh = new THREE.Mesh(blockGeo, blockMaterials(info.pal));
      mesh.castShadow = mesh.receiveShadow = true;
      const outline = new THREE.Mesh(outlineGeo, hoverMat); outline.visible = false; mesh.add(outline);
      scene.add(mesh);
      const blk = { body, mesh, outline, layer: i, ...info, axis: alongX ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 0, 1), rest: body.position.clone() };
      mesh.userData.blk = blk;
      S.blocks.push(blk);
    }
  }
  syncMeshes();
  controls.target.set(0, L * BH * 0.42 - 0.8, 0); // aim low so the tower sits above the bottom panel
  fitCamera();
}

function syncMeshes() {
  for (const b of S.blocks) {
    const p = b.body.interpolatedPosition, q = b.body.interpolatedQuaternion;
    b.mesh.position.set(p.x, p.y, p.z); b.mesh.quaternion.set(q.x, q.y, q.z, q.w);
  }
}

// ---------- pulling ----------
const quakeAmp = () => Math.min(0.32, 0.17 + 0.012 * S.pulls); // cracks shake harder the more you have taken

function startPull(blk) {
  if (S.mode !== 'play' || S.movesLeft <= 0) return;
  if (blk.kind === 'stone') {
    audio.thunk(); buzz(15); pop(blk.mesh.position, 'Stone!', '#e2e6f5');
    toast("Stone blocks can't be pulled."); return;
  }
  S.mode = 'pulling'; S.pulling = blk; setHover(null); audio.pull(); buzz(10);
  S.movesLeft--; updateHUD();
  if (S.tutTarget) hideTip();
  world.bodies.forEach(b => b.wakeUp());
  const toCam = new THREE.Vector3().subVectors(camera.position, blk.mesh.position);
  const dir = blk.axis.clone().multiplyScalar(Math.sign(toCam.dot(blk.axis)) || 1);
  const b = blk.body;
  b.type = CANNON.Body.KINEMATIC; b.mass = 0; b.updateMassProperties();
  b.collisionResponse = false; // slides through its neighbours; the nudge below is the only disturbance
  b.velocity.set(dir.x * 3.2, 0, dir.z * 3.2); b.angularVelocity.set(0, 0, 0);
  blk.pullStart = b.position.clone(); blk.pullDist = BW + 0.4;

  if (blk.cracked && S.freezeT <= 0) {
    if (S.shield) {
      S.shield = false; audio.shield(); pop(blk.mesh.position, 'Shield!', '#8fd3ff'); renderBoosters();
    } else {
      const a = Math.random() * Math.PI * 2;
      quake = { t: 0, dur: 1, amp: quakeAmp(), w: Math.PI * 6, dx: Math.cos(a), dz: Math.sin(a) };
      audio.crack(); buzz([30, 40, 30]); shake = reduceMotion ? 0 : 0.3;
      pop(blk.mesh.position, 'CRACK!', '#ff3b5c');
    }
  } else if (S.freezeT <= 0) {
    const k = 0.35 + Math.random() * 0.35;
    for (const o of S.blocks) if (o.layer === blk.layer + 1) o.body.applyImpulse(new CANNON.Vec3(dir.x * k, 0, dir.z * k));
  }
}

function finishPull() {
  const blk = S.pulling; S.pulling = null;
  world.removeBody(blk.body);
  S.blocks.splice(S.blocks.indexOf(blk), 1);
  S.popping.push({ mesh: blk.mesh, t: 0 });
  blk.outline.visible = false;
  S.pulls++;
  world.bodies.forEach(b => b.wakeUp());
  if (S.mode === 'pulling') S.mode = 'play';
  reveal(blk);
  updateHUD();
  if (S.movesLeft <= 0 && S.mode === 'play') { // last pull: settle for a moment, then auto-bank or fail
    S.mode = 'settling';
    setTimeout(() => {
      if (S.mode !== 'settling') return;
      S.mode = 'play';

    }, 1200);
  }
}

function reveal(blk) {
  const p = blk.mesh.position.clone(), sc = S.cfg.scale;
  burst(p, blk.pal.base, blk.kind === 'color' ? 18 : 34);
  if (blk.kind === 'gem') {
    const v = Math.round(20 * sc); S.potCoins += v;
    pop(p, `+${v}`, '#8fe6ff'); audio.gem(); flyCoins(p, 8);
    comboText('GEM!', `+${v} coins`);
  } else if (blk.kind === 'star') {
    S.potMult += 0.5; pop(p, `×${S.potMult.toFixed(1)}`, '#ffd21f'); audio.mult();
    comboText('Multiplier!', `everything ×${S.potMult.toFixed(1)}`);
  } else {
    S.combo = blk.pal.key === S.lastColor ? S.combo + 1 : 1;
    S.lastColor = blk.pal.key;
    const row = blk.layer < S.layers / 3 ? 5 : blk.layer < S.layers * 2 / 3 ? 3 : 2;
    const v = Math.round(row * sc * S.combo); S.potCoins += v;
    pop(p, `+${v}`, '#ffffff'); audio.pop(S.combo); flyCoins(p, Math.min(8, 1 + Math.ceil(v / 4)));
    if (S.combo >= 2) comboText(COMBO_WORDS[Math.min(S.combo, COMBO_WORDS.length - 1)], `${S.combo}× combo`);
  }
  const st = starsReached();
  if (st > S.starsShown) {
    S.starsShown = st; setTimeout(() => audio.star(), 250); buzz(20);
    if (save.tut === 2) { save.tut = 3; persist(); showTip('Goal reached! Tap BANK to keep your coins, or keep pulling for more stars.', 0, $('bank')); }
  }
  S.tutPulls++;
  if (save.tut === 0) { save.tut = 1; persist(); showTip('Lower blocks pay more. Pull the same color twice in a row for a COMBO!', 5500); }
  else if (save.tut === 1 && (S.combo >= 2 || S.tutPulls >= 3)) { save.tut = 2; persist(); }
}

// ---------- danger / topple / wind ----------
const UP = new CANNON.Vec3(0, 1, 0), tmpV = new CANNON.Vec3();
function measureDanger() {
  let worst = 0;
  for (const blk of S.blocks) {
    if (blk === S.pulling) continue;
    const b = blk.body;
    const drop = (blk.rest.y - b.position.y) / 0.4;
    b.quaternion.vmult(UP, tmpV);
    const tilt = Math.acos(Math.min(1, tmpV.y)) * 180 / Math.PI / 14;
    const shift = Math.hypot(b.position.x - blk.rest.x, b.position.z - blk.rest.z) / 3; // whole-tower slides are fine
    worst = Math.max(worst, drop, tilt, shift);
  }

}

let timeScale = 1, shake = 0, meter = 0, overFor = 0;
function stepQuake(dt) {

  if (quake.t >= quake.dur) { quake = null; ground.velocity.set(0, 0, 0); ground.position.set(0, -0.3, 0); }
  else {
    world.bodies.forEach(b => b.wakeUp());
    const v = quake.amp * quake.w * Math.cos(quake.w * quake.t);
    ground.velocity.set(quake.dx * v, 0, quake.dz * v);
  }

}

  if (S.gustT > 0) return;
  S.gustT = 6 + Math.random() * 4;
  if (quake) return;
  const a = Math.random() * Math.PI * 2;
  quake = { t: 0, dur: 1.5, amp: (0.08 + 0.08 * S.cfg.wind) * RUMBLE, w: Math.PI * 4, dx: Math.cos(a), dz: Math.sin(a) };

}

// ---------- boosters ----------

// ---------- level flow ----------

  S.potCoins = 0; S.potMult = 1; S.combo = 0; S.lastColor = null; S.starsShown = 0; S.movesLeft = cfg.moves;

  if (save.tut === 0) {
    S.tutTarget = S.blocks.filter(b => b.layer === 3)[1]; // a safe middle block
    showTip(`Tap a block to slide it out! You have ${cfg.moves} pulls to reach the goal.`, 0, null, true);
  } else {
    const intro = [['crack', 'New: cracked blocks! They shake the tower, harder the more you have pulled.'],
      ['stone', "New: stone blocks! They can't be pulled, so plan around them."],
      ['wind', 'New: rumbles! The ground shakes every few seconds. A hollow tower may not survive, so be quick.']]

  persist();
  $('winTitle').textContent = `Level ${lvl} Complete!`;

  $('winText').textContent = bonus ? `${nextGoal} Includes +${bonus} for ${S.movesLeft} unused pulls.` : nextGoal;

  if (r.coins && r.boost) return `${r.coins} + boosters`;
  if (r.coins) return String(r.coins);
  return Object.keys(r.boost).map(k => BOOSTERS[k].name).join(' + ');
}
function openDaily() {
  const days = $('days'); days.replaceChildren();
  DAILY.forEach((r, i) => {
    const d = document.createElement('div');
    const claimed = i < save.daily.next, today = i === save.daily.next && dailyAvailable();
    d.className = 'day' + (r.big ? ' big' : '') + (claimed ? ' claimed' : '') + (today ? ' today' : '');
    const iconBg = r.coins ? '' : ' style="background:radial-gradient(circle at 35% 30%,#7fc4ff,#3a72ff);border-radius:50%;padding:4px"';
    d.innerHTML = `<span class="dn">Day ${i + 1}</span><svg${iconBg}><use href="#${rewardIcon(r)}"/></svg><span class="amt"></span>`;
    d.querySelector('.amt').textContent = rewardText(r);
    days.append(d);
  });
  const can = dailyAvailable();
  $('claim').disabled = !can;
  $('claim').textContent = can ? `CLAIM DAY ${save.daily.next + 1}` : 'Come back tomorrow!';
  $('daily').hidden = false;
}
function claimDaily() {
  if (!dailyAvailable()) return;
  const r = DAILY[save.daily.next];
  if (r.coins) save.wallet += r.coins;
  if (r.boost) for (const [k, v] of Object.entries(r.boost)) save.boosters[k] += v;
  save.daily.last = todayKey(); save.daily.next = (save.daily.next + 1) % DAILY.length;
  persist(); audio.bank(); buzz(25); confetti();
  const btn = $('claim').getBoundingClientRect(), tgt = $('mapWallet').getBoundingClientRect();
  if (r.coins) flyCoinsScreen(btn.left + btn.width / 2, btn.top, tgt.left, tgt.top + tgt.height / 2, 10);
  toast(`You got ${rewardText(r)}${r.coins && !r.boost ? ' coins' : ''}!`);
  openDaily(); $('mapWallet').textContent = save.wallet; $('giftDot').hidden = true;
}

// ---------- HUD ----------
function renderStarsBar() {
  const bar = $('bar'); bar.querySelectorAll('.star').forEach(e => e.remove());
  const goals = S.cfg.goals;
  goals.forEach((g, i) => {
    const s = starSvg(false); s.classList.add('star');
    s.style.left = i === 2 ? 'calc(100% - 8px)' : `${g / goals[2] * 100}%`; s.dataset.i = i;
    bar.append(s);
  });
}
function updateHUD() {
  const goals = S.cfg.goals, v = potValue(), st = starsReached();
  $('moves').textContent = S.movesLeft;
  $('movesBadge').classList.toggle('low', S.movesLeft <= 3);
  $('lvlLabel').textContent = S.cfg.hard ? `Level ${S.cfg.n} · Hard` : `Level ${S.cfg.n}`;
  $('wallet').textContent = save.wallet;
  $('pot').textContent = v;
  $('mult').hidden = S.potMult === 1; $('mult').textContent = `×${S.potMult.toFixed(1)}`;
  $('fill').style.width = Math.min(100, v / goals[2] * 100) + '%';
  $('goalTxt').textContent = st >= 3 ? `${v} · 3 stars!` : `${v} / ${goals[st]}`;
  $('bar').querySelectorAll('.star').forEach(s => s.classList.toggle('on', +s.dataset.i < st));
  const bankBtn = $('bank'), ok = st >= 1 && S.mode === 'play';
  bankBtn.disabled = !ok; bankBtn.classList.toggle('ready', ok);
  $('bankSub').textContent = st >= 1 ? `+${v} coins` : `Goal ${goals[0]}`;
}
function updateStability() {
  const s = Math.max(0, 1 - meter);
  const el = $('stab');
  el.style.width = (s * 100) + '%';
  el.style.background = s > 0.6 ? 'var(--green-1)' : s > 0.35 ? 'var(--gold-1)' : 'var(--danger)';
  const warn = s <= 0.4 && S.freezeT <= 0 && (S.mode === 'play' || S.mode === 'pulling');
  $('careful').classList.toggle('on', warn);
  const v = $('vig'); if (S.freezeT <= 0 && v.className !== 'gust') v.className = warn ? 'danger' : '';
}

// ---------- feedback ----------
let toastTimer = 0;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2400);
}
let tipTimer = 0, tipEl = null;
function showTip(text, ms = 0, anchorEl = null, ringOnTarget = false) {
  $('tip').textContent = text; $('tip').hidden = false;
  tipEl = anchorEl; $('ring').hidden = !(anchorEl || ringOnTarget);
  if (!ringOnTarget) S.tutTarget = null;
  clearTimeout(tipTimer); if (ms) tipTimer = setTimeout(hideTip, ms);
}
function hideTip() { $('tip').hidden = true; $('ring').hidden = true; tipEl = null; S.tutTarget = null; }

function toScreen(pos3) { const v = pos3.clone().project(camera); return [(v.x + 1) / 2 * innerWidth, (1 - v.y) / 2 * innerHeight]; }
function pop(pos3, text, color) {
  const [x, y] = toScreen(pos3);
  const el = document.createElement('div');
  el.className = 'pop gt'; el.textContent = text; el.style.color = color;
  el.style.left = x + 'px'; el.style.top = y + 'px';
  document.body.append(el); setTimeout(() => el.remove(), 1100);
}
function comboText(big, small) {
  const el = $('combo');
  el.replaceChildren(big);
  if (small) { const s = document.createElement('small'); s.textContent = small; el.append(s); }
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
}
function flyCoinsScreen(x, y, tx, ty, n, onHit) {
  for (let i = 0; i < n; i++) {
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    c.classList.add('flycoin'); c.innerHTML = '<use href="#i-coin"/>';
    c.style.left = x + 'px'; c.style.top = y + 'px';
    document.body.append(c);
    const sx = (Math.random() - 0.5) * 120, sy = -40 - Math.random() * 80;
    const anim = c.animate([
      { transform: 'translate(0,0) scale(.6)' },
      { transform: `translate(${sx}px,${sy}px) scale(1.1)`, offset: 0.35 },
      { transform: `translate(${tx - x}px,${ty - y}px) scale(.7)` },
    ], { duration: 700, delay: i * 60, easing: 'cubic-bezier(.5,0,.6,1)', fill: 'forwards' });
    anim.onfinish = () => { c.remove(); audio.coin(i); onHit?.(); };
  }
}
function flyCoins(pos3, n) {
  const [x, y] = toScreen(pos3), t = $('handCoin').getBoundingClientRect();
  flyCoinsScreen(x, y, t.left + t.width / 2, t.top + t.height / 2, n,
    () => $('handCoin').animate([{ transform: 'scale(1.35)' }, { transform: 'scale(1)' }], { duration: 160 }));
}
function confetti() {
  if (reduceMotion) return;
  const cols = ['#ff3b5c', '#ffcc1f', '#35d65b', '#2b9dff', '#a65bff', '#ffffff'];
  for (let i = 0; i < 70; i++) {
    const c = document.createElement('div'); c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw'; c.style.background = cols[i % cols.length];
    document.body.append(c);
    const dx = (Math.random() - 0.5) * 200, rot = Math.random() * 720;
    c.animate([{ transform: 'translate(0,0) rotate(0)' }, { transform: `translate(${dx}px,${innerHeight + 60}px) rotate(${rot}deg)` }],
      { duration: 1800 + Math.random() * 1400, delay: Math.random() * 400, easing: 'cubic-bezier(.3,.6,.6,1)', fill: 'forwards' }).onfinish = () => c.remove();
  }
}

const particles = [], pGeo = new THREE.OctahedronGeometry(0.1), whiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true });
function burst(pos, color, n) {
  const mat = new THREE.MeshBasicMaterial({ color, transparent: true });
  for (let i = 0; i < n; i++) {
    const m = new THREE.Mesh(pGeo, i % 3 ? mat : whiteMat); m.position.copy(pos); scene.add(m);
    particles.push({ m, life: 0.9, v: new THREE.Vector3((Math.random() - .5) * 7, Math.random() * 6 + 2, (Math.random() - .5) * 7), spin: Math.random() * 10 });
  }
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i]; p.life -= dt; p.v.y -= 12 * dt;
    p.m.position.addScaledVector(p.v, dt); p.m.rotation.x += p.spin * dt; p.m.rotation.y += p.spin * dt;
    p.m.scale.setScalar(Math.max(0.01, p.life / 0.9));
    if (p.life <= 0) { scene.remove(p.m); particles.splice(i, 1); }
  }
  for (let i = S.popping.length - 1; i >= 0; i--) { // pulled block swells, then pops
    const p = S.popping[i]; p.t += dt;
    const k = p.t < 0.08 ? 1 + p.t * 3 : Math.max(0, 1.24 - (p.t - 0.08) * 6);
    p.mesh.scale.setScalar(k);
    if (k <= 0) { scene.remove(p.mesh); S.popping.splice(i, 1); }
  }
}

// ---------- input ----------
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let down = null;
function setHover(blk) {
  if (hovered === blk) return;
  if (hovered) { hovered.outline.visible = !!(hovered.cracked && S.xray); hovered.outline.material = crackMat; }
  hovered = blk;
  if (blk && blk.kind !== 'stone') { blk.outline.material = hoverMat; blk.outline.visible = true; }
}
function pick(e) {
  const r = canvas.getBoundingClientRect();
  ndc.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(S.blocks.map(b => b.mesh), false);
  return hits.length ? hits[0].object.userData.blk : null;
}
canvas.addEventListener('pointerdown', e => {
  audio.ensure(); down = { x: e.clientX, y: e.clientY, t: performance.now() };
  if (S.mode === 'play' && e.pointerType !== 'mouse') setHover(pick(e));
});
canvas.addEventListener('pointerup', e => {
  if (!down) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), quick = performance.now() - down.t < 500;
  down = null;
  if (e.pointerType !== 'mouse') setHover(null);
  if (moved < 10 && quick && S.mode === 'play') { const blk = pick(e); if (blk) startPull(blk); }
});
canvas.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse') { if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 10) setHover(null); return; }
  const h = S.mode === 'play' ? pick(e) : null;
  setHover(h); canvas.classList.toggle('hot', !!h && h.kind !== 'stone');
});
$('bank').onclick = bank;
addEventListener('keydown', e => { if ((e.key === 'b' || e.key === 'B') && S.mode === 'play') bank(); });
$('next').onclick = () => { audio.click(); startLevel(Math.min(save.unlocked, S.cfg.n + 1)); };
$('winMap').onclick = () => { audio.click(); showMap(); };
$('retry').onclick = () => { audio.click(); startLevel(S.cfg.n); };
$('loseMap').onclick = () => { audio.click(); showMap(); };
$('toMapBtn').onclick = () => { audio.click(); if (S.mode === 'play') showMap(); };
$('popClose').onclick = () => { audio.click(); $('levelPop').hidden = true; };
$('giftBtn').onclick = () => { audio.ensure(); audio.click(); openDaily(); };
$('dailyClose').onclick = () => { audio.click(); $('daily').hidden = true; };
$('claim').onclick = () => { audio.ensure(); claimDaily(); };
function renderMute() {
  $('mute').innerHTML = `<svg><use href="#${save.muted ? 'i-mute' : 'i-sound'}"/></svg>`;
  $('mute').setAttribute('aria-label', save.muted ? 'Sound off' : 'Sound on');
}
$('mute').onclick = () => { save.muted = !save.muted; persist(); renderMute(); audio.ensure(); audio.click(); };

// ---------- loop ----------
let last = performance.now();
const shakeOff = new THREE.Vector3();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  requestAnimationFrame(frame);
  if (S.mode === 'map') return; // the map covers the scene; skip physics and rendering

  stepQuake(dt * timeScale);
  stepWind(dt);
  world.step(1 / 120, dt * timeScale, 10);
  syncMeshes();

  if (S.pulling) {
    const b = S.pulling.body, s = S.pulling.pullStart;
    if (Math.hypot(b.position.x - s.x, b.position.z - s.z) >= S.pulling.pullDist) finishPull();
  }
  if (S.freezeT > 0) {
    S.freezeT -= dt;
    if (S.freezeT <= 0) { setFrozen(false); renderBoosters(); toast('Freeze wore off.'); }
  }
  if ((S.mode === 'play' || S.mode === 'pulling' || S.mode === 'settling') && S.freezeT <= 0) {
    const w = measureDanger();
    meter = Math.max(w, meter * 0.95);
    overFor = w >= 1 ? overFor + dt : 0; // must stay past the limit briefly, so a rattle isn't a collapse
    if (overFor > 0.35) { overFor = 0; topple(); }
  }
  if (S.mode === 'play' || S.mode === 'pulling') updateStability();

  const t = now / 1000;
  crackMat.opacity = 0.55 + 0.4 * Math.sin(t * 6);
  if (S.xray) for (const b of S.blocks) if (b.cracked && b !== hovered) { b.outline.material = crackMat; b.outline.visible = true; }
  if (S.tutTarget && S.blocks.includes(S.tutTarget)) {
    const [x, y] = toScreen(S.tutTarget.mesh.position);
    $('ring').style.left = x + 'px'; $('ring').style.top = y + 'px';
  } else if (tipEl) {
    const r = tipEl.getBoundingClientRect();
    $('ring').style.left = (r.left + r.width / 2) + 'px'; $('ring').style.top = (r.top + r.height / 2) + 'px';
  }

  updateParticles(dt);
  controls.update();
  if (shake > 0) {
    shake = Math.max(0, shake - dt * 0.3);
    shakeOff.set((Math.random() - .5) * shake, (Math.random() - .5) * shake, (Math.random() - .5) * shake);
    camera.position.add(shakeOff); renderer.render(scene, camera); camera.position.sub(shakeOff);
  } else renderer.render(scene, camera);
}

window.topple = { setRumble: k => { RUMBLE = k; }, S, save, startPull, bank, startLevel, showMap, measureDanger, levelConfig, openDaily, claimDaily };
renderMute();
showMap();
requestAnimationFrame(frame);
</script>
