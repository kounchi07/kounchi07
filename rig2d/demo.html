<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;background:#000;overflow:hidden}
svg{display:block}
.label{font-family:Inter,'DejaVu Sans',sans-serif;font-weight:800;font-size:44px;fill:#fff;text-anchor:middle}
</style></head>
<body>
<svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs><radialGradient id="vign" cx=".5" cy=".48" r=".72"><stop offset=".55" stop-color="#0d0610" stop-opacity="0"/><stop offset="1" stop-color="#0d0610" stop-opacity=".8"/></radialGradient></defs>
  <g id="cam"><g id="back"></g><ellipse id="shadow" fill="#000" opacity=".35"/><g id="actor"></g><g id="light"></g></g>
  <rect width="1080" height="1920" fill="url(#vign)"/>
  <rect width="1080" height="1920" fill="#ff9a50" opacity=".06" style="mix-blend-mode:soft-light"/>
  <g id="labelG"><rect x="140" y="70" width="800" height="84" rx="42" fill="#120a08" opacity=".6"/><text id="label" class="label" x="540" y="128"></text></g>
</svg>
<script src="src/rig.js"></script>
<script src="src/kit.js"></script>
<script src="characters/scholar.js"></script>
<script src="scenes/study.js"></script>
<script>
const $ = id => document.getElementById(id);
const room = Study.build();
$('back').innerHTML = room.back;
$('light').innerHTML = room.light;
const hero = new Rig2D.Character(Scholar.spec(), { id: 'hero' });

const feet = { legL: { x: -32, y: -14 }, legR: { x: 32, y: -14 } };
const base = {
  bones: { root: { x: 0, y: 0 }, hips: { y: 0, rot: 0 }, chest: { rot: 0 }, head: { rot: 0, sx: 1, sy: 1 } },
  ik: Object.assign({ armL: { x: -90, y: -250, weight: 0 }, armR: { x: 90, y: -250, weight: 0 } }, feet),
};
const faceBase = Object.assign({}, Rig2D.FACE_DEFAULTS);

// Body keys ease smoothly; face keys snap (like hand-drawn expression swaps).
const body = (t, pose, ease = 'inOut') => ({ t, pose, ease });
const face = (t, f) => ({ t, pose: { face: f }, ease: 'step' });
const tl = new Rig2D.Timeline([
  body(0, base),
  body(1.2, { ik: { armR: { weight: 0 } } }),
  body(1.5, { ik: { armR: { x: 250, y: -540, weight: 1 } }, bones: { chest: { rot: 3 } } }, 'out'),
  body(1.75, { ik: { armR: { x: 205, y: -560 } } }), body(2.0, { ik: { armR: { x: 275, y: -520 } } }),
  body(2.25, { ik: { armR: { x: 205, y: -560 } } }), body(2.5, { ik: { armR: { x: 275, y: -520 } } }),
  body(2.8, { ik: { armR: { x: 90, y: -250, weight: 0 } }, bones: { chest: { rot: 0 } } }),
  // squash & stretch jump
  body(2.8, { bones: { hips: { y: 0 }, root: { y: 0 }, head: { rot: 0, sx: 1, sy: 1 } }, ik: { armL: { x: -90, y: -250, weight: 0 } } }),
  body(3.05, { bones: { root: { y: 0 }, hips: { y: 60 }, head: { sx: 0.92, sy: 1.07 } }, ik: Object.assign({ armL: { weight: 0 }, armR: { weight: 0 } }, feet) }),
  body(3.35, { bones: { root: { y: -300 }, hips: { y: -10 }, head: { sx: 1.1, sy: 0.93 } },
    ik: { legL: { x: -40, y: -70 }, legR: { x: 40, y: -70 }, armL: { x: -170, y: -640, weight: 1 }, armR: { x: 170, y: -640, weight: 1 } } }, 'out'),
  body(3.6, { bones: { root: { y: 0 }, hips: { y: 0 }, head: { sx: 1, sy: 1 } }, ik: feet }, 'in'),
  body(3.75, { bones: { hips: { y: 55 }, head: { sx: 0.9, sy: 1.1 } }, ik: { armL: { weight: 0.3 }, armR: { weight: 0.3 } } }, 'out'),
  body(4.0, { bones: { hips: { y: 0 }, chest: { rot: 0 }, head: { rot: 0, sx: 1, sy: 1 } }, ik: { armL: { x: -90, y: -250, weight: 0 }, armR: { x: 90, y: -250, weight: 0 } } }, 'back'),
  // point
  body(4.4, { ik: { armL: { x: -340, y: -500, weight: 1 } }, bones: { chest: { rot: -7 }, head: { rot: -4 } } }),
  body(5.4, { ik: { armL: { x: -330, y: -520 }, armR: { x: 90, y: -250, weight: 0 } }, bones: { hips: { y: 0 } } }),
  // hands on hips + laugh
  body(5.8, { ik: { armL: { x: -92, y: -240, weight: 1 }, armR: { x: 92, y: -240, weight: 1 } }, bones: { chest: { rot: 0 }, head: { rot: 0 } } }),
  body(6.05, { bones: { chest: { rot: 3 }, hips: { y: 10 } } }), body(6.3, { bones: { chest: { rot: -3 }, hips: { y: 0 } } }),
  body(6.55, { bones: { chest: { rot: 3 }, hips: { y: 10 } } }), body(6.8, { bones: { chest: { rot: 0 }, hips: { y: 0 } } }),
  // arms crossed + angry
  body(6.95, { ik: { armL: { x: -92, y: -240 }, armR: { x: 92, y: -240 } } }),
  body(7.15, { ik: { armL: { x: 46, y: -372 }, armR: { x: -46, y: -386 } }, z: { sleeveR: 21, handR: 21 } }),
  body(8.6, { ik: { armL: { x: 46, y: -372 } } }),

  face(0, Object.assign({}, faceBase, { turn: -0.45, lookX: -1, lookY: -0.3, mouthSmile: 0.2, browRaise: 0.15 })),
  face(1.45, { turn: 0.1, lookX: 0, lookY: 0, mouthSmile: 0.85, mouthOpen: 0.3, browRaise: 0.35, browCurve: 0.4 }),
  face(3.0, { turn: 0, mouthSmile: -0.1, mouthOpen: 0, lidTop: 0.35, browAngle: 0.7, browRaise: -0.2 }),
  face(3.3, { eyeWide: 1, mouthShape: 'o', mouthOpen: 0.5, browRaise: 1, sweat: 1, lidTop: 0, browAngle: 0 }),
  face(3.95, { eyeWide: 0, mouthShape: 'auto', mouthOpen: 0, mouthSmile: 0.3, sweat: 0, browRaise: 0 }),
  face(4.35, { turn: -0.55, lookX: -1, lidTopL: 0.45, browRaiseR: 0.9, browAngleL: 0.4, mouthSmile: 0.7, mouthX: 0.5 }),
  face(5.75, { turn: 0, lookX: 0, blink: 1, eyeSmile: 1, mouthSmile: 0.9, mouthOpen: 0.8, teeth: 0.6, browRaise: 0.4, lidTopL: 0, browRaiseR: 0, browAngleL: 0, mouthX: 0 }),
  face(7.05, { blink: 0, eyeSmile: 0, browAngle: 1.1, browRaise: -0.4, lidTop: 0.2, mouthSmile: -0.6, mouthOpen: 0.3, teeth: 1, anger: 1 }),
]);

const labels = [[0, 'Head turn + eye look'], [1.4, 'Arm IK: wave'], [2.9, 'Squash & stretch jump'], [4.2, 'Point + smug face'], [5.7, 'Hands on hips + laugh'], [7.0, 'Arms crossed + angry']];
const X = 540, Y = 1790, S = 1.3;

window.DURATION = 8.6;
window.render = function (t) {
  const st = Rig2D.alive(tl.at(t), t, { seed: 4 });
  hero.pose(st);
  $('actor').innerHTML = hero.render({ x: X, y: Y, scale: S, t });
  const lift = -((st.bones.root && st.bones.root.y) || 0);
  $('shadow').setAttribute('cx', X); $('shadow').setAttribute('cy', Y + 4);
  $('shadow').setAttribute('rx', 150 * S * (1 - lift / 900)); $('shadow').setAttribute('ry', 22 * S * (1 - lift / 900));
  room.update(t);
  const z = 1 + 0.07 * Rig2D.EASE.inOut(Math.min(1, t / window.DURATION));
  $('cam').setAttribute('transform', `translate(540 1150) scale(${z}) translate(-540 -1150)`);
  let lab = ''; for (const [lt, l] of labels) if (t >= lt) lab = l;
  $('label').textContent = lab;
};
window.render(0);
</script>
</body></html>
