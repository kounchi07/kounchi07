     Deterministic: window.render(t) poses everything for time t, then draws one frame (returns a promise). -->
<script type="module">
import * as THREE from 'three';

const W = 1080, H = 1920;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(40, W / H, 0.05, 60);

let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const rr = (a, b) => a + (b - a) * rnd();

// ---------- cartoon ink outlines (inverted hull): a back-face copy pushed out along the normals ----------
const INK = new THREE.MeshBasicMaterial({ color: '#2b1d16', side: THREE.BackSide });
INK.onBeforeCompile = sh => { sh.uniforms.thick = { value: 0.016 }; sh.vertexShader = 'uniform float thick;\n' + sh.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\ntransformed += normalize(objectNormal) * thick;'); };

// ---------- procedural textures ----------
function canvasTex(w, h, draw, repeat) {

}
function boards(ctx, w, h, base, dark, n, vertical = true) {

  for (let i = 0; i < n; i++) {

    vertical ? ctx.fillRect(i * size, 0, size, h) : ctx.fillRect(0, i * size, w, size);
    ctx.strokeStyle = dark; ctx.lineWidth = 4; ctx.beginPath(); vertical ? (ctx.moveTo(i * size, 0), ctx.lineTo(i * size, h)) : (ctx.moveTo(0, i * size), ctx.lineTo(w, i * size)); ctx.stroke();
    for (let g = 0; g < 10; g++) { ctx.strokeStyle = `rgba(40,18,6,${rr(0.08, 0.22)})`; ctx.lineWidth = rr(0.6, 1.8); ctx.beginPath(); const o = i * size + rr(4, size - 4); if (vertical) { ctx.moveTo(o, 0); for (let y = 0; y <= h; y += 24) ctx.lineTo(o + Math.sin(y * 0.015 + g) * 3, y); } else { ctx.moveTo(0, o); for (let x = 0; x <= w; x += 24) ctx.lineTo(x, o + Math.sin(x * 0.015 + g) * 3); } ctx.stroke(); }
    if (rnd() < 0.5) { const kx = vertical ? i * size + size / 2 : rr(0, w), ky = vertical ? rr(0, h) : i * size + size / 2; ctx.strokeStyle = 'rgba(40,18,6,.5)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(kx, ky, 6, 11, 0, 0, 7); ctx.stroke(); }
    ctx.fillStyle = '#1a1a1a'; for (const k of [0.06, 0.94]) { const p = (i + 0.25) * size; vertical ? ctx.fillRect(p, h * k, 5, 5) : ctx.fillRect(w * k, p, 5, 5); }
  }
}
const PAL = ['#d8483a', '#f2b23a', '#3a8ad0', '#4aa86a', '#c85a9a', '#efe2c0', '#2a6a7a', '#a8642a', '#e8783a'];
const WORDS = ['COFFEE', 'TEA', 'SODA', 'STARCH', 'SPICE', 'SOAP', 'COCOA', 'PEPPER', 'OATS', 'TONIC', 'BLUING', 'MATCHES', 'MUSTARD', 'GINGER',
  'CLOVES', 'LARD', 'SALT', 'SUGAR', 'MOLASSES', 'VINEGAR', 'CANDLES', 'RAISINS', 'CINNAMON', 'NUTMEG', 'LYE', 'HONEY', 'CRACKERS', 'BEANS', 'RICE', 'BISCUITS'];
const BRANDS = ['ACME', 'EAGLE', 'STAR', 'LION', 'QUEEN', 'ROYAL', 'GOLD SEAL', 'PIONEER', 'LIBERTY', 'UNION', 'ARBUCKLE', 'SAUERS', 'QUEST', 'BALDWIN', 'CROWN', 'EMPIRE', 'MONARCH', 'OWL'];

  return new THREE.MeshStandardMaterial({ roughness: 0.6, map: canvasTex(256, 256, (c, w, h) => {
    c.fillStyle = col; c.fillRect(0, 0, w, h); c.textAlign = 'center'; const T = (str, size, y, f = ink) => { c.fillStyle = f; c.font = `bold ${size}px DejaVu Serif`; let sz = size; while (c.measureText(str).width > w - 40 && sz > 12) c.font = `bold ${--sz}px DejaVu Serif`; c.fillText(str, w / 2, y); };
    if (lay === 0) { c.fillStyle = paper; c.fillRect(16, 58, w - 32, 140); c.strokeStyle = ink; c.lineWidth = 5; c.strokeRect(24, 66, w - 48, 124); T(brand, 20, 94); T(word, 46, 148); T('★ FINEST ★', 16, 178); }
    else if (lay === 1) { c.fillStyle = paper; c.beginPath(); c.ellipse(w / 2, h / 2, 100, 74, 0, 0, 7); c.fill(); c.strokeStyle = ink; c.lineWidth = 6; c.stroke(); T(word, 40, h / 2 + 12); T(brand, 18, h / 2 - 34); T('PURE', 16, h / 2 + 46); }
    else if (lay === 2) { c.fillStyle = paper; c.fillRect(0, 70, w, 116); c.fillStyle = ink; c.fillRect(0, 70, w, 10); c.fillRect(0, 176, w, 10); T(word, 44, 145); T(brand, 22, 50, paper); T('CO.', 18, 226, paper); }

    else { c.fillStyle = paper; c.beginPath(); c.arc(w / 2, 96, 56, 0, 7); c.fill(); c.strokeStyle = ink; c.lineWidth = 5; c.stroke(); T(word[0], 64, 118); T(word, 34, 196, paper); T(brand, 16, 228, paper); }
    c.fillStyle = 'rgba(0,0,0,.25)'; c.fillRect(0, 0, w, 10); c.fillRect(0, h - 10, w, 10);
    c.fillStyle = 'rgba(90,60,20,.12)'; for (let i = 0; i < 40; i++) c.fillRect(rr(0, w), rr(0, h), rr(2, 9), rr(2, 9));   // age spots
  }) });
}

// ---------- materials ----------
const M = {

  ceil: new THREE.MeshStandardMaterial({ map: canvasTex(512, 512, (c, w, h) => boards(c, w, h, '#7a4a28', '#2a1408', 6), [3, 3]), roughness: 0.9 }),
  shelf: new THREE.MeshStandardMaterial({ map: canvasTex(512, 64, (c, w, h) => boards(c, w, h, '#b07440', '#4a2a14', 1, false)), roughness: 0.6 }),
  beam: new THREE.MeshStandardMaterial({ map: canvasTex(512, 128, (c, w, h) => boards(c, w, h, '#6a3e20', '#2a1408', 2, false)), roughness: 0.8 }),

  crock: new THREE.MeshStandardMaterial({ color: '#d8c8a8', roughness: 0.35 }),
  basket: new THREE.MeshStandardMaterial({ map: canvasTex(512, 128, (c, w, h) => { boards(c, w, h, '#c89a5a', '#6a4a24', 22); c.strokeStyle = '#5a3a1a'; c.lineWidth = 8; for (const y of [20, 64, 108]) { c.beginPath(); c.moveTo(0, y); c.lineTo(w, y); c.stroke(); } }), roughness: 0.9 }),
};

const ROOM = { x0: -3.2, x1: 4.2, z0: -6.2, z1: 4.5, h: 3.8 };
const plane = (w, h, mat) => new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
// floor, walls, ceiling + beams
{ const f = plane(ROOM.x1 - ROOM.x0, ROOM.z1 - ROOM.z0, M.floor); f.rotation.x = -Math.PI / 2; f.position.set((ROOM.x0 + ROOM.x1) / 2, 0, (ROOM.z0 + ROOM.z1) / 2); f.receiveShadow = true; scene.add(f); }
{ const l = plane(ROOM.z1 - ROOM.z0, ROOM.h, M.wall); l.rotation.y = Math.PI / 2; l.position.set(ROOM.x0, ROOM.h / 2, (ROOM.z0 + ROOM.z1) / 2); l.receiveShadow = true; scene.add(l); }
{ const b = plane(ROOM.x1 - ROOM.x0, ROOM.h, M.wall); b.position.set((ROOM.x0 + ROOM.x1) / 2, ROOM.h / 2, ROOM.z0); b.receiveShadow = true; scene.add(b); }
{ const r = plane(ROOM.z1 - ROOM.z0, ROOM.h, M.wall); r.rotation.y = -Math.PI / 2; r.position.set(ROOM.x1, ROOM.h / 2, (ROOM.z0 + ROOM.z1) / 2); r.receiveShadow = true; scene.add(r); }
{ const c = plane(ROOM.x1 - ROOM.x0, ROOM.z1 - ROOM.z0, M.ceil); c.rotation.x = Math.PI / 2; c.position.set((ROOM.x0 + ROOM.x1) / 2, ROOM.h, (ROOM.z0 + ROOM.z1) / 2); scene.add(c); }
for (let z = -5.6; z < 4.5; z += 1.25) outlined(new THREE.Mesh(new THREE.BoxGeometry(ROOM.x1 - ROOM.x0, 0.22, 0.24), M.beam), scene).position.set((ROOM.x0 + ROOM.x1) / 2, ROOM.h - 0.11, z);
outlined(new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.3, ROOM.z1 - ROOM.z0), M.beam), scene).position.set(0.6, ROOM.h - 0.36, (ROOM.z0 + ROOM.z1) / 2);

// ---------- shelf goods ----------
const goods = new THREE.Group(); scene.add(goods);
function bottle(x, y, z, g = goods) {
  const pts = [[0, 0], [0.05, 0], [0.055, 0.15], [0.035, 0.2], [0.018, 0.23], [0.018, 0.28], [0, 0.28]].map(([a, b]) => new THREE.Vector2(a, b));

  m.position.set(x, y, z);
  const l = outlined(new THREE.Mesh(new THREE.CylinderGeometry(0.057, 0.057, 0.07, 14, 1, true, 0, Math.PI), labelMat(pick(WORDS), '#efe2c0')), g, { ink: false }); l.position.set(x, y + 0.08 * sh, z); l.rotation.y = Math.PI / 2; l.scale.set(sh < 1 ? 1.3 : 1, 1, sh < 1 ? 1.3 : 1);
}
function tin(x, y, z, g = goods) {
  const h = rr(0.1, 0.28), r = rr(0.05, 0.09), m = outlined(new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 18), labelMat(pick(WORDS), pick(PAL))), g); m.position.set(x, y + h / 2, z); m.rotation.y = Math.PI + rr(-0.3, 0.3);
}
function box(x, y, z, g = goods) {
  const w = rr(0.14, 0.22), h = rr(0.18, 0.3), col = pick(PAL), side = new THREE.MeshStandardMaterial({ color: col, roughness: 0.7 });
  const m = outlined(new THREE.Mesh(new RoundedBoxGeometry(0.14, h, w, 2, 0.01), [labelMat(pick(WORDS), col), side, side, side, side, side]), g); m.position.set(x, y + h / 2, z); m.rotation.y = rr(-0.3, 0.3);
}
function jar(x, y, z, g = goods) {
  const gr = new THREE.Group(); gr.position.set(x, y, z); g.add(gr);
  outlined(new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.075, 0.22, 16), M.glass), gr, { cast: false }).position.y = 0.11;
  outlined(new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.035, 16), M.brass), gr).position.y = 0.235;
  const cm = new THREE.MeshStandardMaterial({ color: pick(['#e84a5a', '#f2b23a', '#5ab4e8', '#7ad06a', '#e87ad0']), roughness: 0.3 });
  for (let i = 0; i < 9; i++) { const s = new THREE.Mesh(new THREE.SphereGeometry(0.022, 8, 6), cm); s.position.set(rr(-0.045, 0.045), rr(0.025, 0.14), rr(-0.045, 0.045)); gr.add(s); }
}
function crock(x, y, z, g = goods) {
  const pts = [[0, 0], [0.07, 0], [0.09, 0.08], [0.085, 0.16], [0.06, 0.2], [0.06, 0.22], [0, 0.22]].map(([a, b]) => new THREE.Vector2(a, b));
  const k = rr(0.75, 1.35), m = outlined(new THREE.Mesh(new THREE.LatheGeometry(pts, 18), new THREE.MeshStandardMaterial({ color: pick(['#d8c8a8', '#8a5a3a', '#c8b48a', '#e8dcc4', '#5a6a4a']), roughness: 0.35 })), g); m.position.set(x, y, z); m.scale.setScalar(k);
  if (rnd() < 0.7) { const band = new THREE.Mesh(new THREE.TorusGeometry(0.088, 0.008, 6, 20), new THREE.MeshStandardMaterial({ color: pick(['#3a5a9a', '#8a2a1a', '#2a2a2a']) })); band.rotation.x = Math.PI / 2; band.position.set(x, y + 0.11 * k, z); band.scale.setScalar(k); g.add(band); }
}
function sack(x, y, z, g = goods) {
  const pts = [[0, 0], [0.08, 0], [0.1, 0.06], [0.1, 0.16], [0.07, 0.22], [0.03, 0.25], [0.04, 0.29], [0, 0.29]].map(([a, b]) => new THREE.Vector2(a, b));
  const col = pick(['#c8a878', '#b8946a', '#d8c098']);
  const m = outlined(new THREE.Mesh(new THREE.LatheGeometry(pts, 9), new THREE.MeshStandardMaterial({ color: col, roughness: 1, flatShading: true })), g); m.position.set(x, y, z); m.rotation.y = rr(0, 6);

}
function plates(x, y, z, g = goods) {
  const n = 3 + Math.floor(rnd() * 5), col = pick(['#f4ead6', '#e8eef4']), rim = new THREE.MeshStandardMaterial({ color: pick(['#3a5a9a', '#2a7a5a', '#8a2a2a']) });
  for (let i = 0; i < n; i++) { const p = outlined(new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.06, 0.018, 20), new THREE.MeshStandardMaterial({ color: col, roughness: 0.25 })), g, { ink: i === n - 1 }); p.position.set(x, y + 0.01 + i * 0.02, z); }
  const r = new THREE.Mesh(new THREE.TorusGeometry(0.085, 0.004, 4, 24), rim); r.rotation.x = Math.PI / 2; r.position.set(x, y + 0.02 + (n - 1) * 0.02, z); g.add(r);
}
function bolt(x, y, z, g = goods) {
  const a = pick(PAL), b = pick(['#f4ead6', '#2a2a3a', pick(PAL)]), check = rnd() < 0.5;
  const tex = canvasTex(64, 64, (c, w, h) => { c.fillStyle = a; c.fillRect(0, 0, w, h); c.fillStyle = b; for (let i = 0; i < 8; i += 2) { c.globalAlpha = check ? 0.55 : 1; c.fillRect(i * 8, 0, 6, h); if (check) c.fillRect(0, i * 8, w, 6); } });
  const m = outlined(new THREE.Mesh(new RoundedBoxGeometry(0.3, rr(0.08, 0.14), 0.16, 2, 0.03), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.95 })), g); m.position.set(x, y + 0.06, z); m.rotation.y = rr(-0.15, 0.15);

  for (let i = 0, n = 2 + Math.floor(rnd() * 2); i < n; i++) { const h = 0.07, w = 0.16 - i * 0.015; const m = outlined(new THREE.Mesh(new RoundedBoxGeometry(0.14, h, w, 1, 0.006), [labelMat(word, col), new THREE.MeshStandardMaterial({ color: col })]), g); m.position.set(x, yy + h / 2, z); m.rotation.y = rr(-0.2, 0.2); yy += h; }
}
function pitcher(x, y, z, g = goods) {
  const pts = [[0, 0], [0.06, 0], [0.075, 0.08], [0.06, 0.16], [0.055, 0.2], [0.07, 0.23], [0.065, 0.23]].map(([a, b]) => new THREE.Vector2(a, b));
  const m = outlined(new THREE.Mesh(new THREE.LatheGeometry(pts, 18), new THREE.MeshStandardMaterial({ color: pick(['#f4f0e6', '#7aa8c8', '#c8d8b8']), roughness: 0.2, side: THREE.DoubleSide })), g); m.position.set(x, y, z);
  const hd = new THREE.Mesh(new THREE.TorusGeometry(0.04, 0.01, 6, 12, Math.PI), m.material); hd.position.set(x - 0.07, y + 0.13, z); hd.rotation.z = Math.PI / 2; g.add(hd);
}
const MAKERS = [bottle, bottle, tin, tin, tin, box, box, jar, crock, sack, plates, bolt, stack, pitcher];
// tall shelving on the left wall (uprights, 6 shelves, crown boxes on top)
for (let z = 3.6; z > -6.0; z -= 1.35) outlined(new THREE.Mesh(new THREE.BoxGeometry(0.42, 3.2, 0.06), M.shelf), scene).position.set(ROOM.x0 + 0.21, 1.6, z);
let lastMk = null;
for (let s = 0; s < 6; s++) {
  const y = 0.45 + s * 0.5;
  outlined(new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.04, 9.6), M.shelf), scene).position.set(ROOM.x0 + 0.21, y, -1.2);
  for (const [dx, dy] of [[-0.1, 0.0], [0.04, 0.0]]) for (let z = 3.5; z > -5.9; z -= rr(0.12, 0.17)) { let mk; do mk = pick(MAKERS); while (mk === lastMk); lastMk = mk; const run = mk === tin || mk === box ? 1 + Math.floor(rnd() * 3) : 1; for (let i = 0; i < run && z > -5.9; i++, z -= 0.17) mk(ROOM.x0 + 0.22 + dx + rr(-0.02, 0.02), y + 0.02 + dy, z); }
}
for (let z = 3.2; z > -5.8; z -= rr(0.4, 0.7)) { const h = rr(0.25, 0.4), col = pick(PAL); outlined(new THREE.Mesh(new RoundedBoxGeometry(0.36, h, 0.32, 2, 0.015), [labelMat(pick(WORDS), col), new THREE.MeshStandardMaterial({ color: col })]), scene).position.set(ROOM.x0 + 0.22, 3.22 + h / 2, z); }

// ---------- back wall: window, pigeonholes, notices, churn, lantern ----------
const win = new THREE.Group(); win.position.set(2.4, 1.85, ROOM.z0 + 0.02); scene.add(win);
win.add(Object.assign(plane(1.2, 1.7, new THREE.MeshBasicMaterial({ color: '#fff4d8' })), {}));
const wf = new THREE.MeshStandardMaterial({ color: '#efe6d2', roughness: 0.6 });
for (const [x, y, w, h] of [[0, 0.85, 1.32, 0.08], [0, -0.85, 1.32, 0.1], [-0.62, 0, 0.08, 1.8], [0.62, 0, 0.08, 1.8], [0, 0.28, 1.2, 0.04], [0, -0.28, 1.2, 0.04], [-0.2, 0, 0.04, 1.7], [0.2, 0, 0.04, 1.7]]) outlined(new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.07), wf), win).position.set(x, y, 0.035);
