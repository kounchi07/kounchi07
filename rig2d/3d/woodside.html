  for (let i = 0; i < 26; i++) { const e = new THREE.Mesh(new THREE.SphereGeometry(kind === 'eggs' ? 0.055 : 0.07, 10, 8), m); e.scale.set(1, kind === 'eggs' ? 1.3 : 0.8, 1); const a = rnd() * 6.3, r = Math.sqrt(rnd()) * 0.3; e.position.set(Math.cos(a) * r, 0.36 + rnd() * 0.08, Math.sin(a) * r); e.castShadow = true; g.add(e); }
}
basket(0.0, 3.0, 'eggs'); basket(0.75, 3.5, 'potatoes');

// ---------- lights: lots of it ----------
scene.add(new THREE.HemisphereLight('#ffe8c8', '#5a3a20', 0.9));
const sun = new THREE.DirectionalLight('#fff0d0', 5.5); sun.position.set(4.5, 5.5, -11); sun.target.position.set(0.5, 0, 0.5);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -7, right: 7, top: 7, bottom: -7, near: 1, far: 30 }); sun.shadow.bias = -0.0005; sun.shadow.radius = 5;
scene.add(sun, sun.target);
const fill = new THREE.PointLight('#ffcf9a', 7, 9, 1.4); fill.position.set(2.0, 2.6, 2.2); scene.add(fill);       // warm bounce from the front
const bounce = new THREE.PointLight('#ffb878', 3, 6, 1.5); bounce.position.set(-1.8, 0.6, 0.5); scene.add(bounce);   // floor bounce behind the counter
const lantern = new THREE.Group(); lantern.position.set(1.4, 2.7, -2.8); scene.add(lantern);
outlined(new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.01, 0.9, 6), M.ironDark), lantern).position.y = 0.6;
outlined(new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.15, 0.06, 14), M.ironDark), lantern).position.y = 0.16;
const flame = new THREE.Mesh(new THREE.SphereGeometry(0.075, 14, 10), new THREE.MeshStandardMaterial({ color: '#fff0c0', emissive: '#ffbf60', emissiveIntensity: 4 })); lantern.add(flame);
outlined(new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.22, 14, 1, true), M.glass), lantern, { cast: false });
const lanternLight = new THREE.PointLight('#ffb050', 5, 7, 1.5); lantern.add(lanternLight);
// light shaft through the window + dust
const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 1.6, 9, 4, 1, true), new THREE.MeshBasicMaterial({ color: '#fff2cc', transparent: true, opacity: 0.045, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending }));
shaft.position.set(1.4, 1.4, -2.0); shaft.rotation.set(-0.75, 0.35, 0.2); scene.add(shaft);
const dg = new THREE.BufferGeometry(), dp = []; for (let i = 0; i < 500; i++) dp.push(rr(-1, 3.5), rr(0.2, 3.2), rr(-5.5, 2)); dg.setAttribute('position', new THREE.Float32BufferAttribute(dp, 3));
const dust = new THREE.Points(dg, new THREE.PointsMaterial({ color: '#fff4d0', size: 0.016, transparent: true, opacity: 0.8, depthWrite: false })); scene.add(dust);

// ---------- the 2D clerk, drawn by Rig2D into a texture standing in the room ----------
const CW = 1024, CH = 2048;
const charCanvas = document.createElement('canvas'); charCanvas.width = CW; charCanvas.height = CH;
const charTex = new THREE.CanvasTexture(charCanvas); charTex.colorSpace = THREE.SRGBColorSpace;
const charMat = new THREE.MeshBasicMaterial({ map: charTex, transparent: true, alphaTest: 0.4, side: THREE.DoubleSide, fog: true });
const card = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 2.2), charMat); card.castShadow = true;
card.customDepthMaterial = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, map: charTex, alphaTest: 0.4 });
scene.add(card);
const clerk = new Rig2D.Actor(ST.clerk, { id: 'clerk' });
const EX = Rig2D.EXPRESSIONS, FEET = { legL: { x: -30, y: -12 }, legR: { x: 30, y: -12 } };
const LIGHT2D = Light.preset('interior', { dir: -25, back: true, key: 0.4, rimOp: 0.9, color: '#ffd8a0', castShadow: false });
function drawClerk(t, state) {
  clerk.pose(Rig2D.alive(Object.assign({ view: 'front', ik: FEET }, state, { face: Object.assign({ _t: t }, state.face) }), t, { seed: 5 }));
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${CW}" height="${CH}" viewBox="0 0 ${CW} ${CH}">${Light.render(clerk, { x: CW / 2, y: CH - 40, scale: 2.45, t, light: LIGHT2D, id: 'c', castShadow: false })}</svg>`;
  return new Promise(res => { const img = new Image(); img.onload = () => { const c = charCanvas.getContext('2d'); c.clearRect(0, 0, CW, CH); c.drawImage(img, 0, 0); charTex.needsUpdate = true; res(); }; img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); });
}

// ---------- post: bloom + warm grade + vignette ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), 0.4, 0.55, 0.88));
composer.addPass(new ShaderPass({ uniforms: { tDiffuse: { value: null } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }',
  fragmentShader: 'uniform sampler2D tDiffuse; varying vec2 vUv; void main(){ vec4 c = texture2D(tDiffuse, vUv); vec2 d = vUv - .5; float v = smoothstep(.9, .3, length(d*vec2(1.,.72))); c.rgb *= mix(.7, 1., v); float l = dot(c.rgb, vec3(.3,.59,.11)); c.rgb = mix(vec3(l), c.rgb, 1.12); c.rgb = mix(c.rgb, c.rgb*vec3(1.05,1.0,.92), .5); gl_FragColor = c; }' }));
composer.addPass(new OutputPass());

// ---------- animation (10 s) ----------
const ease = x => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x);
const lerp = (a, b, k) => a + (b - a) * k;
const CRANK = 5.2, GRIN = 7.4;
window.DURATION = 10;
window.render = async function (t) {
  // camera: slow push down the aisle toward the clerk, gentle drift
  const k = ease(t / 10);
  camera.position.set(lerp(2.4, 0.7, k) + Math.sin(t * 0.6) * 0.03, lerp(1.85, 1.6, k) + Math.sin(t * 0.8) * 0.015, lerp(4.4, 2.1, k));
  camera.lookAt(lerp(-1.6, -1.95, k), lerp(1.35, 1.5, k), lerp(-0.7, 0.15, k));
  // clerk: smug look at camera, taps the ledger, then grins
  const crank = t > CRANK && t < GRIN ? 1 : 0, ang = crank * (t - CRANK) * 7;
  const face = t < 2 ? { lookX: -0.6, mouthSmile: 0.2 } : t < CRANK ? EX.smugBar : t < GRIN ? Object.assign({}, EX.worried, { lookX: 0.8, sweat: 0 }) : EX.crazy;
  const reach = crank ? { armR: { x: 150, y: -340 - Math.abs(Math.sin(ang)) * 40, weight: 1 } } : {};   // taps the ledger
  await drawClerk(t, { ik: Object.assign({}, FEET, reach), face });
  card.position.set(-1.95, 1.1, 0.15);
  card.lookAt(camera.position.x, 1.1, camera.position.z);
  // grinder wheels turn while he cranks; lantern flickers; dust drifts
  for (const w of WHEELS.slice(0, 2)) w.rotation.z = -t * 0.4;
  lanternLight.intensity = 5 + Math.sin(t * 13) * 0.4 + Math.sin(t * 29) * 0.25;
  dust.rotation.y = t * 0.015; dust.position.y = Math.sin(t * 0.25) * 0.04;
  composer.render();
};
await window.render(0);
window.READY = true;
</script>
