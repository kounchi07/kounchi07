});

// goals (posts, crossbar, net)

// stands: tiers of seats packed with a crowd (one instanced draw call), each fan a coloured block with a pale head
const STAND = []; { const tiers = 18, perRow = 260; const body = new THREE.BoxGeometry(0.42, 0.55, 0.3), N = tiers * perRow * 4;

  const u = rr(-0.5, 0.5), r = rr(0, 17) * 0.9; if (side < 2) s.position.set((side ? 1 : -1) * (PW / 2 + 8 + r), 1 + r / 0.9 * 0.55, u * (PL + 20)); else s.position.set(u * (PW + 20), 1 + r / 0.9 * 0.55, (side === 2 ? 1 : -1) * (PL / 2 + 8 + r));

for (const [x, z] of [[-PW / 2 - 22, -PL / 2 - 14], [PW / 2 + 22, -PL / 2 - 14], [-PW / 2 - 22, PL / 2 + 14], [PW / 2 + 22, PL / 2 + 14]]) {

{ const body = striker.userData.body;

  num.position.set(0, 0.06, -0.548); num.rotation.y = Math.PI; body.add(num); }

// ---------- the 3D word: our own block letters, extruded and bevelled ----------
function letterShape(ch) {

    const h = new THREE.Vector3(); scene.updateMatrixWorld(); striker.userData.head.getWorldPosition(h);
    placeWord(WORDS.red, 'O', [h.x, h.y, h.z - 1.4], 1.05);
    C = { c: V3([0.35, h.y + 0.05, h.z + 1.9], [0.15, h.y + 0.02, h.z + 1.2], io(k)), l: [h.x, h.y - 0.05, h.z] }; aimLights([0, 2, 0], [10, 14, 16]);
  } else if (sec === 2) { // from behind: #07 walks to the crowd; the white word faces them, so we read it mirrored
    const z = -io(k) * 2.2; pivot.position.set(0, 1.0, z); pivot.rotation.y = Math.PI; poseEmu(striker, t, { speed: 1.2, phase: 0.4, lid: 0.2 });
    placeWord(WORDS.white, 'O', [0, 2.3, z - 3.2], 1.6, Math.PI);
    C = { c: V3([0.6, 1.65, z + 4.2], [0.3, 1.7, z + 3.0], io(k)), l: [0, 1.75, z - 2] }; aimLights([0, 1, z], [12, 20, -14]);
  } else {                // gold word lying on the pitch; the emu stands tall on the O
    pivot.position.set(0, 1.0, 0); pivot.rotation.y = 0.35; poseEmu(striker, t, { lid: 0.55, neck: -0.12, nod: -0.1 + Math.sin(t * 2) * 0.03 });
    placeWord(WORDS.gold, 'O', [0, 0.04, 0.05], 2.4, 0, -Math.PI / 2, 0.25);
    C = { c: V3([5.2, 4.4, 7.8], [3.8, 3.5, 5.8], io(k)), l: [0.1, 0.6, -0.6] }; aimLights([0, 1, 0], [-10, 22, 14]);
  }
  camera.position.set(...C.c); camera.lookAt(...C.l);
  // transitions on each downbeat: zoom blur into the cut, flash out of it
  let amt = 0, fl = 0; for (let s = 1; s <= 4; s++) { const d = t - s * SEC; if (d > -0.12 && d < 0) amt = Math.max(amt, (0.12 + d) / 0.12 * 0.35); if (d >= 0 && d < 0.2) { amt = Math.max(amt, (1 - d / 0.2) * 0.3); fl = Math.max(fl, (1 - d / 0.2) * 0.7); } }
  zoomPass.uniforms.amt.value = amt; gradePass.uniforms.flash.value = fl; gradePass.uniforms.time.value = t;
  composer.render();
};
await window.render(0);
window.READY = true;
</script>
