<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;background:#000;overflow:hidden}
svg{display:block}
.cap{font-family:Inter,'DejaVu Sans',sans-serif;font-weight:900;font-size:88px;fill:#fff;stroke:#120a08;stroke-width:18px;paint-order:stroke;stroke-linejoin:round;text-anchor:middle}
</style></head>
<body>
<svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="vign" cx=".5" cy=".48" r=".72"><stop offset=".55" stop-color="#0d0610" stop-opacity="0"/><stop offset="1" stop-color="#0d0610" stop-opacity=".8"/></radialGradient>
    <clipPath id="aboveHole"><rect x="-500" y="-500" width="2100" height="2230"/></clipPath>
  </defs>
  <g id="shake"><g id="cam"><g id="back"></g><g id="under"></g><g id="actors"></g><g id="over"></g><g id="light"></g></g></g>
  <rect id="dark" width="1080" height="1920" fill="#05020a" opacity="0"/>
  <rect width="1080" height="1920" fill="url(#vign)"/>
  <rect width="1080" height="1920" fill="#ff9a50" opacity=".06" style="mix-blend-mode:soft-light"/>
  <g id="screen"></g>
  <text id="cap" class="cap" x="540" y="1500"></text>
  <rect id="flash" width="1080" height="1920" fill="#fff" opacity="0"/>
</svg>
<script src="../../src/rig.js"></script>
<script src="../../src/kit.js"></script>
<script src="../../src/props.js"></script>
<script src="../../characters/scholar.js"></script>
<script src="../../characters/cast.js"></script>
<script src="../../scenes/study.js"></script>
<script src="cues.js"></script>
<script>
const $ = id => document.getElementById(id);
const { walk, alive, clamp, EASE, EXPRESSIONS: EX, FACE_DEFAULTS, FACE_LAYOUT, drawFace, rng } = Rig2D;
const CUE = window.CUES, EV = CUE.events, LN = CUE.lines, TM = CUE.timing;
const S = 1.3, FLOOR = 1790, INK = '#2b1d16';
const sm = (t, a, b) => EASE.inOut(clamp((t - a) / (b - a), 0, 1));

const room = Study.build();
$('back').innerHTML = room.back;
$('light').innerHTML = room.light;

const scholar = new Rig2D.Actor(Scholar.spec, { id: 'sch' });
const thief = new Rig2D.Actor(Cast.thief, { id: 'th' });
const thiefStache = new Rig2D.Actor(Kit.character(Object.assign({}, Cast.thief.config, { name: 'thief2', face: { mustache: true, mustacheColor: '#8a5a2a', mustacheScale: 2.2 } })), { id: 'th2' });
const FEET = { legL: { x: -32, y: -14 }, legR: { x: 32, y: -14 } };

function draw(actor, state, x, y = FLOOR, t = 0, shadow = true) {
  actor.pose(state);
  const sh = shadow ? `<ellipse cx="${x}" cy="${y + 4}" rx="${(state.view === 'side' ? 110 : 150) * S}" ry="${20 * S}" fill="#000" opacity=".35"/>` : '';
  return sh + actor.render({ x, y, scale: S, t });
}
const toScreen = (actor, bone, x, y, lx = 0, ly = 0) => { const p = actor.current.worldPoint(bone, lx, ly); return [x + p[0] * S * ((actor.state.facing || 1) < 0 ? -1 : 1), y + p[1] * S]; };
const mouthAt = (line, t) => { const m = TM[line].mouth, i = Math.floor((t - LN[line]) * 30); return i >= 0 && i < m.length ? m[i] : 0; };

// ---------- captions: every spoken word with its absolute time ----------
const WORDS = [];
for (const id in LN) for (const w of TM[id].words) WORDS.push([LN[id] + w.start, w.word]);
WORDS.sort((a, b) => a[0] - b[0]);
const lineEnd = id => LN[id] + TM[id].duration;
function caption(t) {
  if (t >= EV.reveal && t < EV.scream) return ['', 0];
  let cur = '', st = 0;
  for (const [wt, w] of WORDS) if (t >= wt) { cur = w; st = wt; }
  const live = Object.keys(LN).some(id => t >= LN[id] - 0.05 && t <= lineEnd(id) + 0.35);
  return live ? [cur, st] : ['', 0];
}

// ---------- special art ----------
function rope(x0, top, hands) {
  const [hx, hy] = hands, bot = hy + 140;
  let s = `<path d="M${x0},${top} Q${(x0 + hx) / 2},${(top + hy) / 2} ${hx},${hy} L${hx + 6},${bot}" stroke="${INK}" stroke-width="22" fill="none" stroke-linecap="round"/>` +
    `<path d="M${x0},${top} Q${(x0 + hx) / 2},${(top + hy) / 2} ${hx},${hy} L${hx + 6},${bot}" stroke="#b8894a" stroke-width="13" fill="none" stroke-linecap="round"/>`;
  for (let k = 0; k < 1; k += 0.035) { const x = x0 + (hx - x0) * k, y = top + (hy - top) * k; s += `<path d="M${x - 6},${y - 4} l12,8" stroke="#7a5428" stroke-width="3"/>`; }
  return s;
}

function hole(cx, cy, t0, t) {
  let back = `<ellipse cx="${cx}" cy="${cy}" rx="240" ry="56" fill="#140a05" stroke="${INK}" stroke-width="6"/><ellipse cx="${cx}" cy="${cy + 8}" rx="200" ry="40" fill="#050302"/>`;
  let front = `<path d="M${cx - 240},${cy} A240,56 0 0 0 ${cx + 240},${cy}" stroke="#6a4222" stroke-width="22" fill="none"/><path d="M${cx - 240},${cy} A240,56 0 0 0 ${cx + 240},${cy}" stroke="${INK}" stroke-width="5" fill="none"/>`;
  const R = rng(5);
  for (let i = 0; i < 14; i++) {
    const a = R() * Math.PI, d = 240 + R() * 50, x = cx + Math.cos(a) * d * (R() < 0.5 ? -1 : 1), y = cy + Math.sin(a) * 30 + 20;
    front += `<ellipse cx="${x}" cy="${y}" rx="${18 + R() * 22}" ry="${10 + R() * 10}" fill="${R() < 0.5 ? '#5a3a1e' : '#7a5228'}" stroke="${INK}" stroke-width="4"/>`;
  }
  const k = t - t0;
  for (let i = 0; i < 18; i++) {
    const vx = (R() - 0.5) * 900, vy = -500 - R() * 700, x = cx + vx * k, y = cy + vy * k + 1400 * k * k;
    if (y < cy + 40) front += `<circle cx="${x}" cy="${y}" r="${6 + R() * 10}" fill="#6a4222" stroke="${INK}" stroke-width="3"/>`;
  }
  return { back, front };
}

function vaseEyes(cx, cy, t, open) {
  const fs = Object.assign({}, FACE_DEFAULTS, { blush: 0, eyeWide: 1, browRaise: 0.7, lookX: Math.sin((t - EV.vase) * 2.2) * 0.9, blink: 1 - open, mouthShape: 'none' });
  const f = drawFace(fs, { cx, cy, rx: 88, ry: 88 }, Object.assign({}, FACE_LAYOUT, { eyeGap: 0.42, eyeR: 0.11, browGap: 0.4, hideMouth: true }), INK, 'vase');
  return `<defs>${f.defs}</defs>${f.svg}`;
}

function bookBack(l, r) {
  const x0 = Math.min(l[0], r[0]) - 30, x1 = Math.max(l[0], r[0]) + 30, y = (l[1] + r[1]) / 2;
  return `<rect x="${x0}" y="${y - 150}" width="${x1 - x0}" height="210" rx="8" fill="#7a2e2a" stroke="${INK}" stroke-width="6"/>` +
    `<rect x="${(x0 + x1) / 2 - 7}" y="${y - 150}" width="14" height="210" fill="#5a1e1a" stroke="${INK}" stroke-width="3"/>` +
    `<rect x="${x0 + 18}" y="${y - 132}" width="${x1 - x0 - 36}" height="174" rx="4" fill="none" stroke="#d8b25a" stroke-width="3"/>` +
    `<path d="M${x0},${y - 150} l26,0 l-26,26Z M${x1},${y - 150} l-26,0 l26,26Z" fill="#d8b25a" stroke="${INK}" stroke-width="2"/>`;
}

function cover(t) {
  // Full-screen reveal: an ancient thread-bound book titled MATH HOMEWORK.
  const k = t - EV.reveal, z = 1.12 - 0.12 * EASE.out(clamp(k / 0.35, 0, 1));
  let s = `<rect width="1080" height="1920" fill="#2a160c"/>`;
  s += P.woodGrain({ x: 0, y: 0, w: 1080, h: 1920, seed: 4, knots: 3, color: '#160a04', op: 0.6 });
  s += `<g transform="translate(540 960) scale(${z}) rotate(-3) translate(-540 -960)">`;
  s += `<rect x="150" y="300" width="800" height="1240" rx="18" fill="#000" opacity=".45" transform="translate(18 22)"/>`;
  s += `<rect x="150" y="300" width="800" height="1240" rx="18" fill="#d8c69a" stroke="${INK}" stroke-width="10"/>`;
  const R = rng(9);
  for (let i = 0; i < 90; i++) s += `<circle cx="${160 + R() * 780}" cy="${310 + R() * 1220}" r="${2 + R() * 10}" fill="#a8905a" opacity="${0.08 + R() * 0.12}"/>`;
  // thread binding
  s += `<rect x="150" y="300" width="120" height="1240" fill="#3a5a6e" stroke="${INK}" stroke-width="8"/>`;
  for (let i = 0; i < 6; i++) { const y = 380 + i * 210; s += `<circle cx="210" cy="${y}" r="9" fill="${INK}"/><path d="M150,${y} L210,${y} M210,${y - 40} L210,${y + 40}" stroke="#efe5cf" stroke-width="7"/>`; }
  // coffee rings, doodles, red stamp, title label
  s += `<circle cx="760" cy="1300" r="120" fill="none" stroke="#8a5a2a" stroke-width="14" opacity=".35"/><circle cx="790" cy="1330" r="104" fill="none" stroke="#8a5a2a" stroke-width="6" opacity=".25"/>`;
  s += `<rect x="330" y="420" width="520" height="560" rx="10" fill="#f6efdc" stroke="#b03a2e" stroke-width="10"/><rect x="350" y="440" width="480" height="520" fill="none" stroke="#b03a2e" stroke-width="3"/>`;
  s += `<text x="590" y="640" font-family="Inter" font-weight="900" font-size="170" fill="${INK}" text-anchor="middle" letter-spacing="4">MATH</text>`;
  s += `<text x="590" y="820" font-family="Inter" font-weight="900" font-size="104" fill="${INK}" text-anchor="middle">HOMEWORK</text>`;
  s += `<text x="590" y="920" font-family="DejaVu Serif" font-style="italic" font-size="44" fill="#6a4a2a" text-anchor="middle">Volume 3,812</text>`;
  s += `<text x="360" y="1150" font-family="DejaVu Sans" font-weight="700" font-size="58" fill="#3a2a8a" transform="rotate(-6 360 1150)">2 + 2 = ???</text>`;
  s += `<text x="340" y="1270" font-family="DejaVu Sans" font-weight="700" font-size="46" fill="#3a2a8a" transform="rotate(4 340 1270)">x² + y² = help</text>`;
  s += `<g transform="translate(400 1420) rotate(-8)"><circle r="56" fill="#f6efdc" stroke="#3a2a8a" stroke-width="7"/><circle cx="-18" cy="-12" r="7" fill="#3a2a8a"/><circle cx="18" cy="-12" r="7" fill="#3a2a8a"/><path d="M-26,28 Q0,6 26,28" stroke="#3a2a8a" stroke-width="7" fill="none"/></g>`;
  const st = clamp((k - 0.25) / 0.12, 0, 1);
  s += `<g transform="translate(790 1110) rotate(14) scale(${1.6 - 0.6 * st})" opacity="${st}"><circle r="110" fill="none" stroke="#c0282a" stroke-width="14"/><circle r="90" fill="none" stroke="#c0282a" stroke-width="5"/><text y="52" font-family="Inter" font-weight="900" font-size="150" fill="#c0282a" text-anchor="middle">F</text></g>`;
  s += `<text x="590" y="1060" font-family="Inter" font-weight="800" font-size="40" fill="#c0282a" text-anchor="middle" transform="rotate(-2 590 1060)">DUE TOMORROW</text>`;
  return s + '</g>';
}

function dust(cx, cy, t0, t, dir) {
  let s = '';
  for (let i = 0; i < 12; i++) {
    const born = t0 + i * 0.09, a = t - born;
    if (a < 0 || a > 0.7) continue;
    const x = cx(born) - dir * (20 + a * 90), r = 18 + a * 90;
    s += `<circle cx="${x}" cy="${cy - a * 40}" r="${r}" fill="#d8c4a0" stroke="${INK}" stroke-width="4" opacity="${1 - a / 0.7}"/>`;
  }
  return s;
}

function catEye(t0, t) {
  const o = clamp((t - t0) / 0.1, 0, 1), x = 872, y = 1702;
  if (o <= 0) return '';
  return `<ellipse cx="${x}" cy="${y}" rx="17" ry="12" fill="#e0954a"/>` +
    `<g transform="translate(${x} ${y}) scale(1 ${o})"><ellipse rx="13" ry="10" fill="#f2d34a" stroke="${INK}" stroke-width="3.5"/><ellipse cx="6" rx="3" ry="8" fill="${INK}"/><path d="M-14,-4 L14,-6" stroke="${INK}" stroke-width="5" stroke-linecap="round"/></g>`;
}

const P = window.Props;

// ---------- shots ----------
function shot(t) {
  let cam = [540, 1150, 1], under = '', actors = '', over = '', screen = '', dark = 0, shake = 0;

  if (t < LN.l2 - 0.2) {                                                  // 1. hook: smug scholar
    cam = [540, 1230, 1.35 + 0.2 * sm(t, 0, 5.4)];
    actors = draw(scholar, alive({ view: 'front', ik: FEET, face: Object.assign({}, EX.smug, { lookX: 0.15 }) }, t, { seed: 2 }), 540);
  } else if (t < EV.ropes) {                                              // 2. thief sneaks in
    const lt = t - (LN.l2 - 0.2), w = walk(lt, { cycle: 1.1, stride: 150, bob: 7, lift: 50, armSwing: 4, lean: 12 });
    const x = 110 + w.speed * S * lt;
    w.bones.root.x = 0; w.bones.hips.y += 30;
    w.ik.armR = { x: 90, y: -420, weight: 1, endRot: 70 }; w.ik.armL = { x: 60, y: -432, weight: 1, endRot: 70 };
    w.face = { lookX: 0.7, lidTop: 0.35, browAngle: 0.6 };
    cam = [540, 1250, 1.12];
    actors = draw(thief, Object.assign(alive(w, t, { seed: 3 }), { view: 'side', facing: 1 }), x);
  } else if (t < EV.tunnels) {                                            // 3a. ropes
    const sw = Math.sin((t - EV.ropes) * 6) * 5, y = FLOOR - 330;
    const st = { view: 'front', z: { sleeveL: 31, sleeveR: 31, handL: 32, handR: 32 }, ik: { armL: { x: -70, y: -720, weight: 1 }, armR: { x: 60, y: -790, weight: 1 }, legL: { weight: 0 }, legR: { weight: 0 } },
      bones: { thighL: { rot: -10 }, thighR: { rot: 14 }, shinL: { rot: 16 }, shinR: { rot: -8 } }, face: { lookX: -0.6, lidTop: 0.4, browAngle: 0.7 } };
    const body = draw(thief, alive(st, t, { seed: 3 }), 540, y, t, false);
    const hr = toScreen(thief, 'handR', 540, y, 12, 0);
    cam = [540, 1020, 1.15];
    actors = `<g transform="rotate(${sw} 540 -100)">${body}${rope(540, -100, hr)}</g>`;
  } else if (t < EV.fake) {                                               // 3b. tunnels
    const k = EASE.back(clamp((t - EV.tunnels) / 0.2, 0, 1)), hy = 1730;
    const h = hole(540, hy, EV.tunnels, t);
    const st = { view: 'front', ik: { armL: { x: -260, y: -700, weight: 1 }, armR: { x: 260, y: -700, weight: 1 } }, face: Object.assign({}, EX.happy) };
    under = h.back;
    actors = `<g clip-path="url(#aboveHole)">${draw(thief, alive(st, t, { seed: 3 }), 540, hy + 300 + 320 * (1 - k), t, false)}</g>`;
    over = h.front;
    cam = [540, 1450, 1.2];
  } else if (t < LN.l4 - 0.05) {                                          // 3c. fake mustache
    const wag = Math.sin((t - EV.fake) * 16) > 0 ? 0.8 : -0.1;
    cam = [540, 1040, 2.05];
    actors = draw(thiefStache, alive({ view: 'front', ik: FEET, face: { lidTopL: 0.5, browRaiseR: wag, browRaiseL: -wag * 0.3, lookX: 0.4 } }, t, { seed: 3 }), 540);
  } else if (t < LN.l5 - 0.1) {                                           // 4. the vase has eyes
    const open = clamp((t - EV.vase) / 0.12, 0, 1);
    over = P.vase({ x: 470, y: 1775, w: 210, h: 400, color: '#3f6f8a', motif: 'cloud', seed: 4 }) + (t >= EV.vase ? vaseEyes(470, 1570, t, open) : '');
    const k = sm(t, LN.l4, EV.vase);
    cam = [540 - 70 * k, 1300 + 270 * k, 1.1 + 0.9 * k];
    shake = t >= EV.vase ? 14 * Math.max(0, 1 - (t - EV.vase) / 0.4) : 0;
  } else if (t < 16.05) {                                                 // 5. reading the book...
    const scared = t >= EV.screaming;
    const st = { view: 'front', ik: Object.assign({ armL: { x: -78, y: -430, weight: 1 }, armR: { x: 78, y: -430, weight: 1 } }, FEET),
      face: scared ? Object.assign({}, EX.scared, { lookX: 0 }) : { lookY: 0.7, lidTop: 0.3, browRaise: 0.2 } };
    const x = 540 + (scared ? Math.sin(t * 90) * 6 : 0);
    actors = draw(thief, alive(st, t, { seed: 3 }), x);
    over = bookBack(toScreen(thief, 'handL', x, FLOOR, 12, 0), toScreen(thief, 'handR', x, FLOOR, 12, 0));
    cam = [540, 1180, 1.45 + (scared ? 0.25 : 0.1 * sm(t, LN.l5, EV.screaming))];
  } else if (t < EV.reveal) {                                             // 6. the shelf...
    const k = sm(t, 16.05, EV.reveal);
    cam = [845, 790 - 120 * k, 1.35 + 1.0 * k];
    dark = 0.4 * k;
    shake = 3 * k;
  } else if (t < EV.scream) {                                             // 7. MATH HOMEWORK
    screen = cover(t);
    shake = 22 * Math.max(0, 1 - (t - EV.reveal) / 0.5);
  } else if (t < EV.run) {                                                // 7b. scream
    cam = [540, 1030, 2.0];
    actors = draw(thief, alive({ view: 'front', ik: FEET, bones: { head: { sx: 1.08, sy: 0.95 } }, face: Object.assign({}, EX.scared, { eyeWide: 1, lookX: 0 }) }, t, { seed: 3 }), 540);
    shake = 10;
  } else if (t < EV.empty) {                                              // 8. runs away
    const lt = t - EV.run, w = walk(lt, { cycle: 0.5, stride: 300, stance: 0.38, bob: 16, lift: 64, armSwing: 55, lean: 16 });
    const xAt = u => 760 - w.speed * S * (u - EV.run);
    w.bones.root.x = 0;
    w.face = { eyeWide: 1, sweat: 1, browRaise: 1 };
    actors = dust(xAt, FLOOR - 10, EV.run, t, -1) + draw(thief, Object.assign(alive(w, t, { seed: 3 }), { view: 'side', facing: -1, props: { sack: false } }), xAt(t));
    for (let i = 0; i < 5; i++) { const y = 1150 + i * 110; over += `<line x1="${xAt(t) + 180}" y1="${y}" x2="${xAt(t) + 420 + i * 30}" y2="${y}" stroke="#fff" stroke-width="6" opacity=".55" stroke-linecap="round"/>`; }
    cam = [540, 1250, 1.1];
  } else if (t < EV.final) {                                              // 9. he never came back
    cam = [540, 1120, 1.02 + 0.04 * sm(t, EV.empty, EV.final)];
  } else if (t < EV.cat) {                                                // 10. works every time
    const talk = t >= LN.l9 && t <= lineEnd('l9') ? mouthAt('l9', t) : 0;
    const face = Object.assign({}, EX.smug, { mouthOpen: 0.75 * talk, lookX: 0.1 });
    actors = draw(scholar, alive({ view: 'front', ik: Object.assign({ armR: { x: 150, y: -470, weight: 1 } }, FEET), face, props: { brush: true } }, t, { seed: 2 }), 540);
    const sp = t - (lineEnd('l9') + 0.05);
    if (sp > 0 && sp < 0.6) {
      const a = 1 - sp / 0.6, x = 640, y = 1010;
      over = `<path d="M${x},${y - 50 * a} L${x + 10},${y - 10} L${x + 50 * a},${y} L${x + 10},${y + 10} L${x},${y + 50 * a} L${x - 10},${y + 10} L${x - 50 * a},${y} L${x - 10},${y - 10}Z" fill="#fff6c0" stroke="${INK}" stroke-width="3"/>`;
    }
    cam = [540, 1150, 1.55];
  } else {                                                                // 11. the cat knows
    const k = sm(t, EV.cat, EV.cat + 0.35);
    over = catEye(EV.cat + 0.15, t);
    cam = [915, 1700, 3.3 + 0.5 * k];
    shake = t > EV.cat + 0.15 ? 8 * Math.max(0, 1 - (t - EV.cat - 0.15) / 0.35) : 0;
  }
  return { cam, under, actors, over, screen, dark, shake };
}

window.DURATION = CUE.duration;
window.render = function (t) {
  const s = shot(t);
  $('under').innerHTML = s.under;
  $('actors').innerHTML = s.actors;
  $('over').innerHTML = s.over;
  $('screen').innerHTML = s.screen;
  $('dark').setAttribute('opacity', s.dark);
  room.update(t);
  const [cx, cy, z] = s.cam;
  $('cam').setAttribute('transform', `translate(540 960) scale(${z}) translate(${-cx} ${-cy})`);
  const R = rng(Math.floor(t * 30) + 1);
  $('shake').setAttribute('transform', s.shake ? `translate(${(R() - 0.5) * s.shake * 2} ${(R() - 0.5) * s.shake * 2})` : '');
  const [cur, st0] = caption(t);
  const pop = 1 + 0.2 * Math.max(0, 1 - (t - st0) / 0.09);
  $('cap').textContent = cur;
  $('cap').setAttribute('transform', `translate(540 1500) scale(${pop}) translate(-540 -1500)`);
  $('cap').style.fill = /OUT|title|vase|screaming|AAA|time/i.test(cur) ? '#ffd84a' : '#fff';
  $('flash').setAttribute('opacity', t >= EV.reveal && t < EV.reveal + 0.15 ? 1 - (t - EV.reveal) / 0.15 : 0);
};
window.render(0);
</script>
</body></html>
