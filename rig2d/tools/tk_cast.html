<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#e9dcc6}</style></head><body>
<svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<script src="../src/rig.js"></script><script src="../src/kit.js"></script><script src="../characters/threekingdoms.js"></script>
<script>
window.DURATION = 1;
window.render = t => {
  const feet = { legL: { x: -32, y: -14 }, legR: { x: 32, y: -14 } };
  const E = Rig2D.EXPRESSIONS;
  const list = [['zhuge', TK.zhuge, { fan: true }, E.smug], ['boyA', TK.boyA, {}, E.happy], ['simaYi', TK.simaYi, {}, E.scared], ['soldierA', TK.soldierA, {}, {}],
                ['sweeperA', TK.sweeperA, {}, E.sleepy], ['boyB', TK.boyB, { broom: true }, {}], ['soldierB', TK.soldierB, {}, E.angry], ['sweeperB', TK.sweeperB, {}, {}]];
  let s = '';
  list.forEach(([n, spec, props, face], i) => {
    const a = new Rig2D.Actor(spec, { id: n });
    const ik = Object.assign({}, feet, n === 'zhuge' ? { armR: { x: 120, y: -470 } } : {});
    a.pose({ view: i < 4 ? 'front' : 'side', facing: 1, ik, face, props });
    s += a.render({ x: 135 + (i % 4) * 270, y: i < 4 ? 900 : 1820, scale: 0.6 });
  });
  document.getElementById('s').innerHTML = s;
};
</script></body></html>
