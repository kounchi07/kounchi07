<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}</style></head><body>
<svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920"><g id="world"></g></svg>
<script src="../src/rig.js"></script><script src="../src/props.js"></script><script src="../src/camera.js"></script><script src="../scenes/city.js"></script>
<script>
const scenes = [City.exterior(), City.street(), City.walltop()];
const cams = [{ x: 1200, y: 1150, z: 0.8, r: 0 }, { x: 540, y: 1100, z: 1, r: 0 }, { x: 540, y: 1150, z: 1, r: 0 }];
window.DURATION = 3;
window.render = t => {
  const i = Math.min(2, Math.floor(t)), sc = scenes[i];
  document.getElementById('world').innerHTML = sc.layers.map(l => `<g id="L-${l.id}" transform="${Camera.transform(cams[i], l.depth, sc.origin)}">${l.svg}</g>`).join('');
  sc.update(t, { gateOpen: 0.6, pluck: 1, march: 1 });
  if (i === 0) document.getElementById('L-army').innerHTML = sc.army({ x0: 1500, x1: 2600, y0: 1450, y1: 1800, rows: 6, t, march: 1 });
};
</script></body></html>
