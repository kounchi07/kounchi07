<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}svg{display:block}
text{font-family:'DejaVu Sans',sans-serif;font-weight:700;font-size:34px;fill:#fff;stroke:#000;stroke-width:6px;paint-order:stroke;text-anchor:middle}</style></head>
<body>
<!-- Light test sheet: top row = no lighting, bottom row = Light presets. Same pose, same character. -->
<svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"><defs id="d"></defs><g id="stage"></g></svg>
<script src="../src/rig.js"></script>
<script src="../src/kit.js"></script>
<script src="../src/light.js"></script>
<script src="../characters/threekingdoms.js"></script>
<script>
const BG = {
  day: ['#9fd0ff', '#e8f3ff', '#c9b48a'], golden: ['#ff9a5a', '#ffd9a0', '#a8724a'], overcast: ['#8a96a8', '#c8d0dc', '#7a7a70'],
  interior: ['#6a4a3a', '#c89a70', '#5a3a2a'], night: ['#0e0c2a', '#3a2a6a', '#1a1636'], candle: ['#1a0a08', '#6a3018', '#2a140c'], forge: ['#2a0a04', '#ff7a2a', '#3a1608'],
};
const names = ['day', 'golden', 'night', 'candle', 'forge', 'interior'];
const A = new Rig2D.Actor(TK.zhuge, { id: 'z' });
const FEET = { legL: { x: -32, y: -14 }, legR: { x: 32, y: -14 } };
window.DURATION = 1;
window.render = function () {
  let defs = '', s = '';
  names.forEach((n, i) => {
    const col = i % 3, row = Math.floor(i / 3), x0 = col * 360, y0 = row * 960, b = BG[n];
    defs += `<linearGradient id="bg${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${b[0]}"/><stop offset=".62" stop-color="${b[1]}"/><stop offset=".62" stop-color="${b[2]}"/><stop offset="1" stop-color="${b[2]}"/></linearGradient>`;
    s += `<rect x="${x0}" y="${y0}" width="360" height="960" fill="url(#bg${i})"/>`;
    // light source marker (left half lit from the right side of each panel)
    const src = { x: x0 + 330, y: y0 + 420 };
    if (n === 'candle' || n === 'forge' || n === 'night') s += `<circle cx="${src.x}" cy="${src.y}" r="26" fill="${n === 'night' ? '#ffcf7a' : '#ffd27a'}" opacity=".9"/>`;
    A.pose({ view: 'front', ik: FEET, props: { fan: true }, face: { lidTop: 0.3, mouthSmile: 0.3 } });
    s += `<g opacity=".95">${A.render({ x: x0 + 95, y: y0 + 880, scale: 0.36 })}</g>`;
    A.pose({ view: 'front', ik: FEET, props: { fan: true }, face: { lidTop: 0.3, mouthSmile: 0.3 } });
    const L = Light.preset(n, ['candle', 'forge', 'night'].includes(n) ? { source: src } : {});
    s += Light.render(A, { x: x0 + 250, y: y0 + 880, scale: 0.36, light: L, id: 'p' + i });
    s += `<text x="${x0 + 180}" y="${y0 + 60}">${n}</text><text x="${x0 + 95}" y="${y0 + 940}" style="font-size:24px">off</text><text x="${x0 + 250}" y="${y0 + 940}" style="font-size:24px">lit</text>`;
  });
  document.getElementById('d').innerHTML = defs;
  document.getElementById('stage').innerHTML = s;
};
window.render(0);
</script></body></html>
